# Alembic — migrações do Timenow GestNow
#
# A URL do banco NÃO fica aqui: todo ambiente fornece GESTNOW_DATABASE_URL
# (decisão D5) e migrations/env.py a lê. Cada fatia de módulo acrescenta o
# próprio arquivo de revisão, na ordem, com:
#
#   cd api && .venv/Scripts/python.exe -m alembic revision --autogenerate --rev-id 0002 -m central_acoes

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[project]
name = "timenow-gestnow-api"
version = "0.1.0"
description = "Timenow GestNow — Azure SWA + Alpine.js with Python Azure Functions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.0",
    "azure-functions>=2.2.0",
    "azure-storage-blob>=12.31.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
]
# Removido em 13/08/2026: "httpx2>=2.9.1".
# Nenhum código do projeto importa cliente HTTP, e o pacote (publicado em
# 24/07/2026, junto de "httpcore2") tem nome adjacente ao canônico "httpx",
# que não consta do lockfile. Como a dependência não era usada, foi retirada
# em vez de auditada. Se for intencional, basta reinserir a linha e rodar
# `uv lock`. Ver C7 em ../../PLANO-DE-ACAO.md.

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

# ═══════════════════════════════════════════════════════════════════════════
# pytest — as regras que o linter não vê
#
# O conftest recria o banco gestnow_teste pelas migrações e roda cada teste
# dentro de uma transação desfeita no fim. Exige o Postgres local preparado
# pelo run.bat e a variável GESTNOW_DATABASE_URL (gravada em
# api/local.settings.json, fora do git).
#
#   api/.venv/Scripts/python.exe -m pytest
# ═══════════════════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.azure-functions]
# The directory where function_app.py lives (relative to project root).
app_location = "."
# Python programming model version.
programming_model = "v2"

# ═══════════════════════════════════════════════════════════════════════════
# Ruff — linter e formatador
#
# Antes desta configuração o ruff rodava só com os defaults (E4, E7, E9, F),
# que é um punhado de regras. O conjunto abaixo é rigoroso mas prático: entra
# o que pega defeito de verdade, fica de fora o que só gera ruído em revisão.
#
#   ruff check .          conferir
#   ruff check . --fix    corrigir o que é automático
#   ruff format .         formatar
# ═══════════════════════════════════════════════════════════════════════════
[tool.ruff]
target-version = "py313"
line-length = 100

# O ruff também formata blocos de código Python dentro de Markdown. Nos
# nossos .md os exemplos são didáticos — quebras e alinhamentos foram
# escolhidos para ilustrar, não para compilar. Deixar o formatador reescrevê-los
# faria a documentação mudar sozinha a cada `ruff format`.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle — espaçamento, linha em branco no fim do arquivo
    "F",       # pyflakes — variável não usada, import morto, nome indefinido
    "I",       # isort — ordem dos imports
    "N",       # pep8-naming
    "UP",      # pyupgrade — sintaxe obsoleta para a versão de Python alvo
    "B",       # bugbear — armadilhas reais (mutável como default, etc.)
    "C4",      # comprehensions
    "DTZ",     # datetime sem fuso — fonte clássica de bug silencioso
    "SIM",     # simplificações
    "RET",     # returns redundantes
    "PTH",     # prefira pathlib a os.path
    "ARG",     # argumento não usado
    "PIE",     # sobras
    "ISC",     # concatenação implícita de string
    "TID",     # imports ordenados por origem
    "S",       # bandit — segurança
    "RUF",     # regras do próprio ruff

    # ── Clean code, na parte que é mecânica ──────────────────────────
    # Princípios de docs/CLEAN-CODE.md que dá para verificar sem
    # julgamento. O que exige leitura humana ficou de fora e está na
    # checklist de revisão.
    "C90",     # complexidade ciclomática — "faça uma coisa só"
    "PLR09",   # excesso de argumento, retorno, ramo e statement
    "FBT",     # flag booleana como parâmetro — o guia chama de armadilha
    "ERA",     # código comentado esquecido no arquivo
    "TRY",     # tratamento de exceção
]

ignore = [
    # Comprimento de linha fica com o formatador, não com o linter — senão os
    # dois brigam em comentário longo e string que não dá para quebrar.
    "E501",
    # Conflita com `ruff format`, conforme a própria documentação do ruff.
    "ISC001",
]

[tool.ruff.lint.mccabe]
# Limite 10 é o padrão do ruff e o mais citado na literatura. O código
# atual passa com folga — serve de alarme, não de meta.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# AlpineAjaxResponse.__init__ tem 8 parâmetros, e é assim de propósito:
# depois do `*` são todos KEYWORD-ONLY (request, target_id, root_class,
# status_code, toast, toast_tipo). A regra dos "2 argumentos, idealmente" do
# clean code existe porque parâmetro posicional cria ordem que se erra na
# chamada — problema que argumento nomeado não tem. Reduzir aqui significaria
# criar um objeto de opções, que é a mesma coisa com mais indireção.
"src/core/responses.py" = ["PLR0913"]
# O modelo de programação V2 do Azure Functions EXIGE o parâmetro `req` na
# assinatura de todo handler, mesmo quando a rota não lê nada da requisição
# (o caso de /api/health). Não é argumento esquecido — é contrato do
# framework, e "corrigir" quebraria o registro da função.
"src/blueprints/*.py" = ["ARG001"]

# `save_parameter_group` e `_create_version` têm 6 parâmetros, e é assim de
# propósito: depois do `*` são todos KEYWORD-ONLY (author_id, group, values,
# effective_from, justification). A regra do clean code existe para argumento
# posicional, onde a ordem se erra na chamada — problema que argumento nomeado
# não tem; reduzir significaria criar um objeto de opções, a mesma coisa com
# mais indireção.
"src/modulos/configuracoes/service.py" = ["PLR0913"]

# assert em teste é o ponto do teste; S101 aqui seria ruído.
"**/test_*.py" = ["S101"]

# process_bind_param e process_result_value recebem o dialect por contrato do
# SQLAlchemy (TypeDecorator) e não o usam: o tipo só converte centavos. O
# parâmetro não pode ser renomeado para `_dialect` porque o ty exige o nome
# do método sobrescrito — é falso positivo estrutural, não argumento esquecido.
"src/core/money.py" = ["ARG002"]

# `criar_colaborador` e `requisicao`, em tests/identidades.py, montam dados de
# teste com muitos argumentos opcionais, e é assim de propósito: depois do `*`
# são todos KEYWORD-ONLY, e cada teste informa só o que importa para o caso
# (perfil, vínculo, empresa, papéis, cookie, corpo...). A regra existe para
# argumento posicional, onde a ordem se erra na chamada; reduzir significaria
# criar um objeto de opções, a mesma coisa com mais indireção.
"tests/identidades.py" = ["PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ═══════════════════════════════════════════════════════════════════════════
# ty — verificador de tipos
#
# O ruff pega estilo e armadilha sintática; o ty pega o que só aparece
# seguindo o tipo pelo código — atributo que não existe, retorno que não
# bate com a anotação, None que escapa sem checagem.
#
#   ty check
# ═══════════════════════════════════════════════════════════════════════════
[tool.ty.environment]
python-version = "3.13"
# `src/` é a raiz dos pacotes; sem isto o ty não resolve `from src.core...`
# do mesmo jeito que o runtime do Functions resolve.
root = ["."]

[tool.ty.src]
include = ["src", "function_app.py"]
exclude = [".venv", "__pycache__"]

[tool.ty.rules]
# O padrão do ty já é sensato. Estas duas sobem para `error` porque são
# exatamente a classe de defeito que passou despercebida neste projeto
# antes — atributo lido de objeto que não o tem, e nome que só existe em
# um dos caminhos de execução.
possibly-unresolved-reference = "error"
unresolved-attribute = "error"

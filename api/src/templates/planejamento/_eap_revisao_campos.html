{#
  Campos da revisão da EAP (ISSUE-038): a SM aprovada com impacto em escopo, o pacote afetado,
  o peso novo, a quantidade (só no critério Unidades) e o término novo. Os demais pesos são
  reescalados pelo servidor para fechar 100%; a validação é do servidor e o 422 marca o campo.
  Sem <link>, <style> nem <script>.

  Espera: opcoes, valores, erros, mensagem, formulario, alvo_conteudo e alvo_formulario.
#}
<section class="card eap-revisao" aria-labelledby="eap-revisao-titulo">
  <div class="card__head">
    <div>
      <h2 class="h-card4" id="eap-revisao-titulo">Nova revisão da EAP</h2>
      <span class="hint">Rev {{ opcoes.next_revision }} · a partir de SM aprovada com impacto em escopo; os demais pesos são reescalados para fechar 100%</span>
    </div>
    <button type="button" class="iconbtn" aria-label="Fechar o formulário"
      x-init="$el.innerHTML = window.icon('dismiss', 16)"
      @click="document.getElementById('eap-formulario').replaceChildren()"></button>
  </div>
  <div class="card__body">
    {% if mensagem or erros %}
    <div class="aviso aviso--erro mb-16" role="alert">
      <strong>Não foi possível criar a revisão.</strong>
      {% if mensagem %}<span>{{ mensagem }}</span>{% endif %}
      {% for texto in erros.values() %}<span>{{ texto }}</span>{% endfor %}
    </div>
    {% endif %}
    <form method="post" action="/api/planejamento/eap/revisoes"
      x-target="{{ alvo_formulario }} {{ alvo_conteudo }}" data-tn-loading="Salvando...">
      <div class="fgrid">
        <div class="field field--full">
          <label for="eap-revisao-sm">SM aprovada</label>
          <select id="eap-revisao-sm" class="input{% if erros.get('sm') %} input--erro{% endif %}" name="sm" required
            {% if erros.get('sm') %}aria-invalid="true" aria-describedby="eap-revisao-sm-erro"{% endif %}>
            <option value="">Escolha a SM que aprovou a mudança</option>
            {% for fonte in opcoes.changes %}
            <option value="{{ fonte.value }}"{% if (valores.get('sm') or '') == fonte.value %} selected{% endif %}>{{ fonte.text }}</option>
            {% endfor %}
          </select>
          <span class="hint">Só as SM aprovadas com impacto em escopo que nenhuma revisão incorporou ainda.</span>
          {% if erros.get('sm') %}<span class="field__erro" id="eap-revisao-sm-erro" role="alert">{{ erros['sm'] }}</span>{% endif %}
        </div>
        <div class="field field--full">
          <label for="eap-revisao-pacote">Pacote afetado</label>
          <select id="eap-revisao-pacote" class="input{% if erros.get('pacote') %} input--erro{% endif %}" name="pacote" required
            {% if erros.get('pacote') %}aria-invalid="true" aria-describedby="eap-revisao-pacote-erro"{% endif %}>
            <option value="">Escolha o pacote</option>
            {% for pacote in opcoes.work_packages %}
            <option value="{{ pacote.value }}"{% if (valores.get('pacote') or '') == pacote.value %} selected{% endif %}>{{ pacote.text }}</option>
            {% endfor %}
          </select>
          {% if erros.get('pacote') %}<span class="field__erro" id="eap-revisao-pacote-erro" role="alert">{{ erros['pacote'] }}</span>{% endif %}
        </div>
        <div class="field">
          <label for="eap-revisao-peso">Novo peso (% do projeto)</label>
          <input id="eap-revisao-peso" class="input{% if erros.get('peso') %} input--erro{% endif %}"
            type="number" name="peso" min="0" max="{{ opcoes.limits.max_package_weight }}" step="0.01"
            value="{{ valores.get('peso') or '' }}" required
            {% if erros.get('peso') %}aria-invalid="true" aria-describedby="eap-revisao-peso-erro"{% endif %} />
          {% if erros.get('peso') %}<span class="field__erro" id="eap-revisao-peso-erro" role="alert">{{ erros['peso'] }}</span>{% endif %}
        </div>
        <div class="field">
          <label for="eap-revisao-quantidade">Nova quantidade da linha de base</label>
          <input id="eap-revisao-quantidade" class="input{% if erros.get('quantidade') %} input--erro{% endif %}"
            type="number" name="quantidade" min="0" step="0.01" value="{{ valores.get('quantidade') or '' }}"
            {% if erros.get('quantidade') %}aria-invalid="true" aria-describedby="eap-revisao-quantidade-erro"{% endif %} />
          <span class="hint">Só para pacotes do critério Unidades; não pode ficar abaixo do executado.</span>
          {% if erros.get('quantidade') %}<span class="field__erro" id="eap-revisao-quantidade-erro" role="alert">{{ erros['quantidade'] }}</span>{% endif %}
        </div>
        <div class="field">
          <label for="eap-revisao-termino">Novo término da linha de base</label>
          <input id="eap-revisao-termino" class="input{% if erros.get('termino') %} input--erro{% endif %}"
            type="date" name="termino" value="{{ valores.get('termino') or '' }}"
            {% if erros.get('termino') %}aria-invalid="true" aria-describedby="eap-revisao-termino-erro"{% endif %} />
          <span class="hint">Deixe em branco para manter o da linha de base.</span>
          {% if erros.get('termino') %}<span class="field__erro" id="eap-revisao-termino-erro" role="alert">{{ erros['termino'] }}</span>{% endif %}
        </div>
        <div class="field field--full">
          <label for="eap-revisao-justificativa">Justificativa</label>
          <textarea id="eap-revisao-justificativa" class="input{% if erros.get('justificativa') %} input--erro{% endif %}"
            name="justificativa" rows="2" minlength="10" maxlength="300" required
            {% if erros.get('justificativa') %}aria-invalid="true" aria-describedby="eap-revisao-justificativa-erro"{% endif %}>{{ valores.get('justificativa') or '' }}</textarea>
          {% if erros.get('justificativa') %}<span class="field__erro" id="eap-revisao-justificativa-erro" role="alert">{{ erros['justificativa'] }}</span>{% endif %}
        </div>
      </div>
      <div class="acoes-rodape mt-24">
        <button type="button" class="btn btn--secondary"
          @click="document.getElementById('eap-formulario').replaceChildren()">Cancelar</button>
        <button type="submit" class="btn btn--primary">Criar revisão</button>
      </div>
    </form>
  </div>
</section>

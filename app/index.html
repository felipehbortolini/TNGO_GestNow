<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Timenow GestNow</title>
    <link rel="icon" type="image/png" href="/ds/assets/favicon-timenow.png" />

    <!-- ============================================================
         Design System — caminho absoluto, sem CDN.
         Este é o ÚNICO lugar do app que carrega estilo e JS de UI.
         Fragmentos nunca trazem <link>, <style> ou <script src>.
         Ver docs/CONTRATO-VISUAL.md, Regras 1 e 2.

         Absoluto e não relativo porque o navigationFallback reescreve
         qualquer rota para este arquivo: num deep link em /exemplo/42,
         "ds/tokens.css" resolveria como "/exemplo/ds/tokens.css".
         ============================================================ -->
    <link rel="stylesheet" href="/ds/tokens.css" />
    <link rel="stylesheet" href="/ds/shell.css" />
    <link rel="stylesheet" href="/ds/patterns.css" />

    <!-- Barra lateral (D2): trilho de ícones em tela estreita (até 1100 px) ou
         quando a pessoa a recolheu. A classe precisa valer antes da primeira
         pintura, senão a barra completa aparece e salta para o trilho; a
         mesma regra vive em ds/shell.js (aplicarTrilho). -->
    <script>
      (function () {
        var recolhida = false;
        try {
          recolhida = localStorage.getItem("gestnow.sidebar.recolhida") === "1";
        } catch (e) { /* armazenamento bloqueado: vale o padrão */ }
        if (window.matchMedia("(max-width: 1100px)").matches || recolhida) {
          document.documentElement.classList.add("sidebar-trilho");
        }
      })();
    </script>

    <script defer src="/ds/icons.js"></script>
    <script defer src="/ds/ui.js"></script>
    <script defer src="/ds/dica.js"></script>
    <script defer src="/ds/shell.js"></script>
    <script defer src="/lib/alpine-ajax-0.12.7.min.js"></script>
    <script defer src="/lib/alpinejs-3.14.8.min.js"></script>
  </head>

  <body>
    <a href="#app-shell" class="skip-link">Pular para o conteúdo</a>

    <!-- ============================================================
         O componente "shell" (ds/shell.js) é o roteador: confere a sessão,
         pede /api/nav e abre a view do endereço. Sequência de boot:
           1. confere o sentinela do Design System (script no fim do body)
           2. consulta /.auth/me
           3. sem sessão  → carrega /login.html
           4. com sessão  → revela a sidebar, carrega o glossário das siglas
                            e abre a tela do endereço (ou o Início)
         ============================================================ -->
    <div class="app" x-data="shell" @ajax:redirect="window.location.reload()">
      <!-- Sidebar — servida por /api/nav depois da autenticação. O servidor é
           dono dos links, do escopo e do card de usuário, então dá para variar
           a navegação por perfil sem tocar no shell. Enquanto não chega,
           mostra esqueleto. Nunca é ocultada (D2). -->
      <aside id="main-nav" class="sidebar" aria-label="Navegação principal" style="display: none">
        <div class="sidebar__brand"><div class="skeleton-marca"></div></div>
      </aside>

      <div class="app__coluna">
        <!-- Abas do módulo, da mesma resposta de /api/nav. Ficam fora do
             <main> para sobreviver à troca de tela. -->
        <div id="module-tabs" class="module-tabs" hidden></div>

        <!-- Área de conteúdo. Cada view de _views/ substitui este elemento
             inteiro, por isso a raiz do fragmento precisa ser
             <main id="app-shell" class="content">. -->
        <main id="app-shell" class="content">
          <div class="page-loading">
            <img class="page-loading__img" src="/ds/assets/loading-pagina.gif" alt="" />
            <p class="page-loading__txt">Carregando...</p>
          </div>
        </main>
      </div>
    </div>

    <!-- Glossário das siglas (oculto): /api/glossario o preenche no boot e
         ds/dica.js lê dele o significado de cada sigla. -->
    <div id="glossario" hidden></div>

    <!-- Raízes de overlay: modais e toasts vivem fora do shell para não
         serem descartados quando a view é trocada.

         role="status" além do aria-live: o papel já implica live="polite" e
         atomic="true", e é o que alguns leitores de tela reconhecem de forma
         mais confiável. A região tem que existir vazia desde o carregamento —
         leitor de tela só anuncia o que é INSERIDO numa região já observada;
         criar a região junto com o conteúdo não dispara anúncio. -->
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

    <!-- ============================================================
         Regra 4 do contrato visual — a ausência de estilo falha alto.
         Sem isto, um <link> quebrado (foi o caso do /kyno-theme.css que
         apontava para arquivo inexistente) serve uma tela sem estilo e
         ninguém percebe.
         ============================================================ -->
    <script>
      (function () {
        var carregado = getComputedStyle(document.documentElement)
          .getPropertyValue("--ds-carregado").trim();
        if (carregado) return;
        document.body.innerHTML =
          '<pre style="margin:0;padding:24px;font:14px/1.6 monospace;color:#D03636;' +
          'white-space:pre-wrap">O Design System não carregou.\n\n' +
          "Confira os <link> de /ds/ no <head> de index.html:\n" +
          "  /ds/tokens.css  (define o sentinela --ds-carregado)\n" +
          "  /ds/shell.css\n" +
          "  /ds/patterns.css\n\n" +
          "Ver docs/CONTRATO-VISUAL.md, Regra 4.</pre>";
      })();
    </script>
  </body>
</html>

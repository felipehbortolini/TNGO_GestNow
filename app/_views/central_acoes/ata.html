<main id="app-shell" class="content pagina--central_acoes-ata"
  x-data="{ estado: 'carregando' }"
  x-init="TN.paginas['central_acoes/ata'].iniciar($el)">
  <div class="page">
    <div class="page-head">
      <div>
        <h1 class="h-dash">Ata</h1>
        <p class="page-head__sub">Dados da reunião, lista de presença, anotações e ações da ata.</p>
      </div>
      <div class="page-head__actions">
        <a href="/central-acoes/atas" class="btn btn--secondary" data-tn-tela>Voltar às atas</a>
      </div>
    </div>

    <!-- A ficha é um fragmento do servidor (api/src/templates/central_acoes/ata.html). O 404 traz o
         aviso de ata não encontrada dentro do próprio fragmento; carregando, erro e sem permissão
         são daqui. -->
    <div id="ata-ficha" x-show="estado === 'pronto'"
      x-init="$ajax('/api/central-acoes/ata' + window.location.search, { target: 'ata-ficha' })"></div>

    <div class="card" x-show="estado !== 'pronto'">
      <div class="card__body">
        <div class="empty" data-estado="carregando" x-show="estado === 'carregando'" role="status">
          <div class="spinner" aria-hidden="true"></div>
          <p>Carregando a ata...</p>
        </div>

        <div class="aviso aviso--erro" data-estado="erro" x-show="estado === 'erro'" role="alert">
          <h2 class="h-card5">Não foi possível carregar a ata</h2>
          <p class="body-txt">Confira a conexão e tente de novo.</p>
        </div>

        <div class="guard" data-estado="sem-permissao" x-show="estado === 'sem-permissao'">
          <img src="/ds/assets/ilustra-acesso-negado.png" alt="" loading="lazy" />
          <h2 class="h-card3">Acesso negado</h2>
          <p>Você não tem permissão para ver esta tela.</p>
          <a href="/" class="btn btn--primary" data-tn-tela>Voltar ao início</a>
        </div>
      </div>
    </div>
  </div>
</main>

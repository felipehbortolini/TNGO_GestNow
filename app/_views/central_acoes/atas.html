<main id="app-shell" class="content pagina--central_acoes-atas"
  x-data="{ estado: 'carregando', carregar() { return this.$ajax('/api/central-acoes/atas', { target: 'atas-conteudo' }) } }"
  x-init="TN.paginas['central_acoes/atas'].iniciar($el)">
  <div class="page">
    <div class="page-head">
      <div>
        <h1 class="h-dash">Atas</h1>
        <p class="page-head__sub">Atas de reunião do projeto: aparece a revisão mais recente de cada ata.</p>
      </div>
    </div>

    <!-- Os estados vazio de origem e vazio por filtro vêm do servidor, dentro do fragmento
         (api/src/templates/central_acoes/atas.html, blocos data-estado), porque a busca e os
         botões continuam na tela. Carregando, erro e sem permissão são daqui. -->
    <div class="empty" data-estado="carregando" x-show="estado === 'carregando'" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p>Carregando as atas...</p>
    </div>

    <div class="aviso aviso--erro" data-estado="erro" x-show="estado === 'erro'" role="alert">
      <h2 class="h-card5">Não foi possível carregar as atas</h2>
      <p class="body-txt">Confira a conexão e tente de novo.</p>
      <div>
        <button type="button" class="btn btn--secondary btn--sm" data-atas-recarregar>Tentar de novo</button>
      </div>
    </div>

    <div class="guard" data-estado="sem-permissao" x-show="estado === 'sem-permissao'">
      <img src="/ds/assets/ilustra-acesso-negado.png" alt="" loading="lazy" />
      <h2 class="h-card3">Acesso negado</h2>
      <p>Você não tem permissão para ver esta tela.</p>
      <a href="/" class="btn btn--primary" data-tn-tela>Voltar ao início</a>
    </div>

    <div x-show="estado === 'conteudo'">
      <div id="atas-conteudo"></div>
    </div>
  </div>
</main>

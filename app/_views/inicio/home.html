<main id="app-shell" class="content pagina--inicio-home"
  x-data="{ estado: 'carregando', carregar(url) { return this.$ajax(url || '/api/inicio/resumo' + window.location.search, { target: 'inicio-conteudo' }) } }"
  x-init="TN.paginas['inicio/home'].iniciar($el)">
  <div class="page">
    <div class="page-head">
      <div>
        <h1 class="h-dash" data-i18n="Início">Início</h1>
        <p class="page-head__sub" data-i18n="Indicadores-chave por módulo e pontos de atenção calculados na data de referência.">Indicadores-chave por módulo e pontos de atenção calculados na data de referência.</p>
      </div>
    </div>

    <!-- O vazio de origem vem do servidor, dentro do fragmento (api/src/templates/inicio/home.html,
         bloco data-estado), porque a barra de contexto e os dados do escopo são do servidor.
         Carregando, erro e sem permissão são daqui. -->
    <div class="empty" data-estado="carregando" x-show="estado === 'carregando'" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p data-i18n="Carregando o resumo do projeto...">Carregando o resumo do projeto...</p>
    </div>

    <div class="aviso aviso--erro" data-estado="erro" x-show="estado === 'erro'" role="alert">
      <h2 class="h-card5" data-i18n="Não foi possível carregar o resumo">Não foi possível carregar o resumo</h2>
      <p class="body-txt" data-i18n="Confira a conexão e tente de novo.">Confira a conexão e tente de novo.</p>
      <div>
        <button type="button" class="btn btn--secondary btn--sm" data-home-recarregar data-i18n="Tentar de novo">Tentar de novo</button>
      </div>
    </div>

    <div class="guard" data-estado="sem-permissao" x-show="estado === 'sem-permissao'">
      <img src="/ds/assets/ilustra-acesso-negado.png" alt="" loading="lazy" />
      <h2 class="h-card3" data-i18n="Acesso negado">Acesso negado</h2>
      <p data-i18n="Você não tem permissão para ver esta tela.">Você não tem permissão para ver esta tela.</p>
      <a href="/" class="btn btn--primary" data-tn-tela data-i18n="Voltar ao início">Voltar ao início</a>
    </div>

    <div x-show="estado === 'conteudo'">
      <div id="inicio-conteudo"></div>
    </div>
  </div>
</main>

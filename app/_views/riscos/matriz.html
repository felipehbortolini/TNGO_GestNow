<main id="app-shell" class="content pagina--riscos-matriz"
  x-data="{ estado: 'carregando', carregar(url) { return this.$ajax(url || '/api/riscos/matriz' + window.location.search, { target: 'matriz-conteudo' }) } }"
  x-init="TN.paginas['riscos/matriz'].iniciar($el)">
  <div class="page">
    <div class="page-head">
      <div>
        <h1 class="h-dash" data-i18n="Matriz de riscos 5x5">Matriz de riscos 5x5</h1>
        <p class="page-head__sub" data-i18n="Contagem de riscos por probabilidade e impacto, com acesso ao Registro.">Contagem de riscos por probabilidade e impacto, com acesso ao Registro.</p>
      </div>
    </div>

    <!-- O vazio de origem vem do servidor, dentro do fragmento (api/src/templates/riscos/matriz.html,
         bloco data-estado), porque a barra de ferramentas continua na tela. Carregando, erro e sem
         permissão são daqui. -->
    <div class="empty" data-estado="carregando" x-show="estado === 'carregando'" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p data-i18n="Carregando a matriz de riscos...">Carregando a matriz de riscos...</p>
    </div>

    <div class="aviso aviso--erro" data-estado="erro" x-show="estado === 'erro'" role="alert">
      <h2 class="h-card5" data-i18n="Não foi possível carregar a matriz">Não foi possível carregar a matriz</h2>
      <p class="body-txt" data-i18n="Confira a conexão e tente de novo.">Confira a conexão e tente de novo.</p>
      <div>
        <button type="button" class="btn btn--secondary btn--sm" data-matriz-recarregar data-i18n="Tentar de novo">Tentar de novo</button>
      </div>
    </div>

    <div class="guard" data-estado="sem-permissao" x-show="estado === 'sem-permissao'">
      <img src="/ds/assets/ilustra-acesso-negado.png" alt="" loading="lazy" />
      <h2 class="h-card3" data-i18n="Acesso negado">Acesso negado</h2>
      <p data-i18n="Você não tem permissão para ver esta tela.">Você não tem permissão para ver esta tela.</p>
      <a href="/" class="btn btn--primary" data-tn-tela data-i18n="Voltar ao início">Voltar ao início</a>
    </div>

    <div x-show="estado === 'conteudo' || estado === 'vazio-origem'">
      <div id="matriz-conteudo"></div>
    </div>
  </div>
</main>

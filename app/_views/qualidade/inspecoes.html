<main id="app-shell" class="content pagina--qualidade-inspecoes"
  x-data="{ estado: 'carregando', carregar(url) { return this.$ajax(url || '/api/qualidade/inspecoes' + window.location.search, { target: 'inspecoes-conteudo' }) } }"
  x-init="TN.paginas['qualidade/inspecoes'].iniciar($el)">
  <div class="page">
    <div class="page-head">
      <div>
        <h1 class="h-dash">Inspeções e ITP</h1>
        <p class="page-head__sub">Planos de inspeção e testes com pontos H, W e R, e os registros por ponto.</p>
      </div>
    </div>

    <!-- Os estados vazio de origem e vazio por filtro vêm do servidor, dentro do fragmento. -->
    <div class="empty" data-estado="carregando" x-show="estado === 'carregando'" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p>Carregando as inspeções...</p>
    </div>

    <div class="aviso aviso--erro" data-estado="erro" x-show="estado === 'erro'" role="alert">
      <h2 class="h-card5">Não foi possível carregar as inspeções</h2>
      <p class="body-txt">Confira a conexão e tente de novo.</p>
      <div>
        <button type="button" class="btn btn--secondary btn--sm" data-inspecoes-recarregar>Tentar de novo</button>
      </div>
    </div>

    <div class="guard" data-estado="sem-permissao" x-show="estado === 'sem-permissao'">
      <img src="/ds/assets/ilustra-acesso-negado.png" alt="" loading="lazy" />
      <h2 class="h-card3">Acesso negado</h2>
      <p>Você não tem permissão para ver esta tela.</p>
      <a href="/" class="btn btn--primary" data-tn-tela>Voltar ao início</a>
    </div>

    <div x-show="estado === 'conteudo'">
      <div id="inspecoes-conteudo"></div>
    </div>
  </div>
</main>

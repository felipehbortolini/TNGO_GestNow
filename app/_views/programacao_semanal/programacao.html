<main id="app-shell" class="content pagina--programacao_semanal-programacao"
  x-data="{ estado: 'carregando' }"
  x-init="TN.paginas['programacao_semanal/programacao'].iniciar($el)">
  <div class="page">
    <div class="page-head">
      <div>
        <h1 class="h-dash">Programação</h1>
        <p class="page-head__sub">Matriz de atividades de segunda a domingo, com previsto e realizado por turno.</p>
      </div>
    </div>

    <div class="empty" data-estado="carregando" x-show="estado === 'carregando'" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p>Carregando...</p>
    </div>

    <div class="aviso aviso--erro" data-estado="erro" x-show="estado === 'erro'" role="alert">
      <h2 class="h-card5">Não foi possível carregar os dados</h2>
      <p class="body-txt">Confira a conexão e tente de novo.</p>
      <button type="button" class="btn btn--secondary" @click="TN.paginas['programacao_semanal/programacao'].iniciar($root)">Tentar de novo</button>
    </div>

    <div class="guard" data-estado="sem-permissao" x-show="estado === 'sem-permissao'">
      <img src="/ds/assets/ilustra-acesso-negado.png" alt="" loading="lazy" />
      <h2 class="h-card3">Acesso negado</h2>
      <p>Você não tem permissão para ver esta tela.</p>
      <a href="/" class="btn btn--primary" data-tn-tela>Voltar ao início</a>
    </div>

    <!-- Os estados "vazio de origem" e "vazio por filtro" vêm dentro de #prog-tabela, do servidor. -->
    <div class="prog" x-show="estado === 'pronto'" x-cloak>
      <div id="prog-janela"></div>
      <div id="prog-filtros"></div>
      <div id="prog-resumo" class="kpis"></div>
      <div id="prog-tabela"></div>
    </div>
    <div id="drawer"></div>
  </div>
</main>

<main id="app-shell" class="content pagina--planejamento-punch_list"
  x-data="{ estado: 'carregando', carregar(url) { return this.$ajax(url || '/api/planejamento/punch-list', { target: 'punch-conteudo' }) } }"
  x-init="TN.paginas['planejamento/punch_list'].iniciar($el)">
  <div class="page">
    <div class="page-head">
      <div>
        <h1 class="h-dash">Punch list</h1>
        <p class="page-head__sub">Itens de completação com verificação, bloqueio de sistema e painel.</p>
      </div>
    </div>

    <!-- Os estados vazio de origem e vazio por filtro vêm do servidor, dentro do fragmento
         (api/src/templates/planejamento/punch_list.html, blocos data-estado), porque os
         indicadores e a barra de ferramentas continuam na tela. Carregando, erro e sem
         permissão são daqui. -->
    <div class="empty" data-estado="carregando" x-show="estado === 'carregando'" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p>Carregando a punch list...</p>
    </div>

    <div class="aviso aviso--erro" data-estado="erro" x-show="estado === 'erro'" role="alert">
      <h2 class="h-card5">Não foi possível carregar a punch list</h2>
      <p class="body-txt">Confira a conexão e tente de novo.</p>
      <div>
        <button type="button" class="btn btn--secondary btn--sm" data-punch-recarregar>Tentar de novo</button>
      </div>
    </div>

    <div class="guard" data-estado="sem-permissao" x-show="estado === 'sem-permissao'">
      <img src="/ds/assets/ilustra-acesso-negado.png" alt="" loading="lazy" />
      <h2 class="h-card3">Acesso negado</h2>
      <p>Você não tem permissão para ver esta tela.</p>
      <a href="/" class="btn btn--primary" data-tn-tela>Voltar ao início</a>
    </div>

    <div x-show="estado === 'conteudo'">
      <div id="punch-conteudo"></div>
    </div>
  </div>
</main>

<main id="app-shell" class="content pagina--planejamento-punch_list"
  x-data="{ estado: 'carregando', aba: 'lista' }"
  x-init="TN.paginas['planejamento/punch_list'].iniciar($el)">
  <div class="page">
    <div class="page-head">
      <div>
        <h1 class="h-dash">Punch list</h1>
        <p class="page-head__sub">Itens de completação com verificação, evidência obrigatória e bloqueio de sistema.</p>
      </div>
    </div>

    <span hidden data-punch-carga
      x-init="$ajax('/api/planejamento/punch', { target: 'punch-filtros punch-conteudo punch-painel' })"></span>

    <div x-show="estado === 'conteudo' || estado === 'vazio-filtro' || estado === 'vazio-origem'">
      <div class="tabs" role="tablist" aria-label="Visões da Punch list">
        <button type="button" class="tab" role="tab" id="punch-aba-lista" aria-controls="punch-tab-lista"
          :class="{ 'is-active': aba === 'lista' }" :aria-selected="aba === 'lista'"
          data-punch-aba="lista">Lista</button>
        <button type="button" class="tab" role="tab" id="punch-aba-painel" aria-controls="punch-tab-painel"
          :class="{ 'is-active': aba === 'painel' }" :aria-selected="aba === 'painel'"
          data-punch-aba="painel">Painel</button>
      </div>

      <section class="mt-16" role="tabpanel" id="punch-tab-lista" aria-labelledby="punch-aba-lista"
        x-show="aba === 'lista'">
        <div id="punch-filtros"></div>

        <div id="punch-conteudo"></div>
      </section>

      <section class="mt-16" role="tabpanel" id="punch-tab-painel" aria-labelledby="punch-aba-painel"
        x-show="aba === 'painel'" data-punch-painel-url="/api/planejamento/punch/painel">
        <div id="punch-painel"></div>
      </section>
    </div>

    <div class="card" x-show="estado === 'carregando'">
      <div class="card__body">
        <div class="empty" data-estado="carregando" role="status">
          <div class="spinner" aria-hidden="true"></div>
          <p>Carregando...</p>
        </div>
      </div>
    </div>

    <div class="card" x-show="estado === 'erro' || estado === 'sem-permissao'">
      <div class="card__body">
        <div class="aviso aviso--erro" data-estado="erro" x-show="estado === 'erro'" role="alert">
          <h2 class="h-card5">Não foi possível carregar os dados</h2>
          <p class="body-txt">Confira a conexão e tente de novo.</p>
        </div>

        <div class="guard" data-estado="sem-permissao" x-show="estado === 'sem-permissao'">
          <img src="/ds/assets/ilustra-acesso-negado.png" alt="" loading="lazy" />
          <h2 class="h-card3">Acesso negado</h2>
          <p>Você não tem permissão para ver esta tela.</p>
          <a href="/" class="btn btn--primary" data-tn-tela>Voltar ao início</a>
        </div>
      </div>
    </div>
  </div>
</main>

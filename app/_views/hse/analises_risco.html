<main id="app-shell" class="content pagina--hse-analises_risco"
  x-data="{ estado: 'carregando', carregar(url) { return this.$ajax(url || '/api/hse/analises-de-risco' + window.location.search, { target: 'analises-conteudo' }) } }"
  x-init="TN.paginas['hse/analises_risco'].iniciar($el)">
  <div class="page">
    <div class="page-head">
      <div>
        <h1 class="h-dash">Análises de risco (APR/HAZOP)</h1>
        <p class="page-head__sub">Estudos APR/JSA e HAZOP, com as recomendações que viram ações.</p>
      </div>
    </div>

    <!-- Os estados vazio de origem e vazio por filtro vêm do servidor, dentro do fragmento
         (api/src/templates/hse/_analises_tabela.html, blocos data-estado), porque os indicadores
         e o filtro continuam na tela. Carregando, erro e sem permissão são daqui. -->
    <div class="empty" data-estado="carregando" x-show="estado === 'carregando'" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p>Carregando os estudos...</p>
    </div>

    <div class="aviso aviso--erro" data-estado="erro" x-show="estado === 'erro'" role="alert">
      <h2 class="h-card5">Não foi possível carregar os estudos</h2>
      <p class="body-txt">Confira a conexão e tente de novo.</p>
      <div>
        <button type="button" class="btn btn--secondary btn--sm" data-hse-recarregar>Tentar de novo</button>
      </div>
    </div>

    <div class="guard" data-estado="sem-permissao" x-show="estado === 'sem-permissao'">
      <img src="/ds/assets/ilustra-acesso-negado.png" alt="" loading="lazy" />
      <h2 class="h-card3">Acesso negado</h2>
      <p>Você não tem permissão para ver esta tela.</p>
      <a href="/" class="btn btn--primary" data-tn-tela>Voltar ao início</a>
    </div>

    <div x-show="estado === 'conteudo'">
      <div id="analises-conteudo"></div>
    </div>
  </div>
</main>

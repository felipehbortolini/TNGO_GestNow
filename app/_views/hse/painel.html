<main id="app-shell" class="content pagina--hse-painel"
  x-data="{ estado: 'carregando', carregar(url) { return this.$ajax(url || '/api/hse/painel' + window.location.search, { target: 'painel-conteudo' }) } }"
  x-init="TN.paginas['hse/painel'].iniciar($el)">
  <div class="page">
    <div class="page-head">
      <div>
        <h1 class="h-dash">Painel HSE</h1>
        <p class="page-head__sub">Taxas reativas e proativas, pirâmides, dias sem afastamento e evolução.</p>
      </div>
    </div>

    <!-- O vazio de origem vem do servidor, dentro do fragmento (api/src/templates/hse/painel.html,
         bloco data-estado), porque a barra de ferramentas continua na tela. Carregando, erro e sem
         permissão são daqui. -->
    <div class="empty" data-estado="carregando" x-show="estado === 'carregando'" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p>Carregando o painel HSE...</p>
    </div>

    <div class="aviso aviso--erro" data-estado="erro" x-show="estado === 'erro'" role="alert">
      <h2 class="h-card5">Não foi possível carregar o painel</h2>
      <p class="body-txt">Confira a conexão e tente de novo.</p>
      <div>
        <button type="button" class="btn btn--secondary btn--sm" data-painel-recarregar>Tentar de novo</button>
      </div>
    </div>

    <div class="guard" data-estado="sem-permissao" x-show="estado === 'sem-permissao'">
      <img src="/ds/assets/ilustra-acesso-negado.png" alt="" loading="lazy" />
      <h2 class="h-card3">Acesso negado</h2>
      <p>Você não tem permissão para ver esta tela.</p>
      <a href="/" class="btn btn--primary" data-tn-tela>Voltar ao início</a>
    </div>

    <div x-show="estado === 'conteudo' || estado === 'vazio-origem'">
      <div id="painel-conteudo"></div>
    </div>
  </div>
</main>

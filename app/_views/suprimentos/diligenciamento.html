<main id="app-shell" class="content pagina--suprimentos-diligenciamento"
  x-data="{ estado: 'carregando', carregar(url) { return this.$ajax(url || '/api/suprimentos/diligenciamento' + window.location.search, { target: 'diligenciamento-conteudo' }) } }"
  x-init="TN.paginas['suprimentos/diligenciamento'].iniciar($el)">
  <div class="page">
    <div class="page-head">
      <div>
        <h1 class="h-dash" data-i18n="Diligenciamento e recebimento">Diligenciamento e recebimento</h1>
        <p class="page-head__sub" data-i18n="Marcos dos pedidos, folga sobre o ROS, ação na Central e recebimento na obra.">Marcos dos pedidos, folga sobre o ROS, ação na Central e recebimento na obra.</p>
      </div>
    </div>

    <!-- Os estados vazio de origem e vazio por filtro vêm do servidor, dentro do fragmento
         (api/src/templates/suprimentos/diligenciamento.html, blocos data-estado), porque os KPIs e
         a barra de ferramentas continuam na tela. Carregando, erro e sem permissão são daqui. -->
    <div class="empty" data-estado="carregando" x-show="estado === 'carregando'" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p data-i18n="Carregando o diligenciamento...">Carregando o diligenciamento...</p>
    </div>

    <div class="aviso aviso--erro" data-estado="erro" x-show="estado === 'erro'" role="alert">
      <h2 class="h-card5" data-i18n="Não foi possível carregar o diligenciamento">Não foi possível carregar o diligenciamento</h2>
      <p class="body-txt" data-i18n="Confira a conexão e tente de novo.">Confira a conexão e tente de novo.</p>
      <div>
        <button type="button" class="btn btn--secondary btn--sm" data-diligencia-recarregar data-i18n="Tentar de novo">Tentar de novo</button>
      </div>
    </div>

    <div class="guard" data-estado="sem-permissao" x-show="estado === 'sem-permissao'">
      <img src="/ds/assets/ilustra-acesso-negado.png" alt="" loading="lazy" />
      <h2 class="h-card3" data-i18n="Acesso negado">Acesso negado</h2>
      <p data-i18n="Você não tem permissão para ver esta tela.">Você não tem permissão para ver esta tela.</p>
      <a href="/" class="btn btn--primary" data-tn-tela data-i18n="Voltar ao início">Voltar ao início</a>
    </div>

    <div x-show="estado === 'conteudo'">
      <div id="diligenciamento-conteudo"></div>
    </div>
  </div>
</main>

<main id="app-shell" class="content pagina--suprimentos-plano_compras"
  x-data="{ estado: 'carregando', carregar(url) { return this.$ajax(url || '/api/suprimentos/plano-de-compras' + window.location.search, { target: 'plano-compras-conteudo' }) } }"
  x-init="TN.paginas['suprimentos/plano_compras'].iniciar($el)">
  <div class="page">
    <div class="page-head">
      <div>
        <h1 class="h-dash">Plano de compras</h1>
        <p class="page-head__sub">Pacotes de compra com datas da linha de base, ROS e vínculo à EAC.</p>
      </div>
    </div>

    <!-- Os estados vazio de origem e vazio por filtro vêm do servidor, dentro do fragmento
         (api/src/templates/suprimentos/plano_compras.html, blocos data-estado), porque os KPIs e a
         barra de ferramentas continuam na tela. Carregando, erro e sem permissão são daqui. -->
    <div class="empty" data-estado="carregando" x-show="estado === 'carregando'" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p>Carregando o plano de compras...</p>
    </div>

    <div class="aviso aviso--erro" data-estado="erro" x-show="estado === 'erro'" role="alert">
      <h2 class="h-card5">Não foi possível carregar o plano de compras</h2>
      <p class="body-txt">Confira a conexão e tente de novo.</p>
      <div>
        <button type="button" class="btn btn--secondary btn--sm" data-plano-recarregar>Tentar de novo</button>
      </div>
    </div>

    <div class="guard" data-estado="sem-permissao" x-show="estado === 'sem-permissao'">
      <img src="/ds/assets/ilustra-acesso-negado.png" alt="" loading="lazy" />
      <h2 class="h-card3">Acesso negado</h2>
      <p>Você não tem permissão para ver esta tela.</p>
      <a href="/" class="btn btn--primary" data-tn-tela>Voltar ao início</a>
    </div>

    <div x-show="estado === 'conteudo'">
      <div id="plano-compras-conteudo"></div>
    </div>
  </div>
</main>

tt.innerHTML=h;tt.style.display='block';
var r=cw.getBoundingClientRect();
var x=e.clientX-r.left+12,y=e.clientY-r.top+12;
if(x+tt.offsetWidth>cw.clientWidth-8)x=e.clientX-r.left-tt.offsetWidth-12;
if(y+tt.offsetHeight>cw.clientHeight-8)y=Math.max(4,cw.clientHeight-tt.offsetHeight-8);
tt.style.left=x+'px';tt.style.top=y+'px';}
function draw(){
var rows=sel===null?D:D.filter(function(d){return d.a===sel;});
var mos=mkM(rows),ch=document.getElementById('ch');
document.getElementById('tt').style.display='none';
if(!mos.length){ch.innerHTML='';return;}
var cw=document.getElementById('cw');
var svgW=Math.max(cw.clientWidth||900,300);
var H=Math.max(cw.clientHeight||460,200);
var DH=H-PT-PB,drawW=svgW-PL-PR;
var slots=0;
mos.forEach(function(mo){mo.ex=!!EX[mo.k];
slots+=mo.ex?mo.wks.length:1;});
if(!slots){ch.innerHTML='';return;}
var slotW=drawW/slots;
var x=PL;
mos.forEach(function(mo){mo.x0=x;
if(mo.ex){mo.wks.forEach(function(wk,i){wk.px=x+i*slotW+slotW/2;});
mo.tw=mo.wks.length*slotW;}
else{mo.tw=slotW;
var bLb=0,bPr=0,bRl=0,hLb=false,hPr=false,hRl=false;
var alb=null,apr=null,arl=null;
mo.wks.forEach(function(wk){
if(wk.lb!==null){bLb+=wk.lb;hLb=true;}
if(wk.pr!==null){bPr+=wk.pr;hPr=true;}
if(wk.rl!==null){bRl+=wk.rl;hRl=true;}
if(wk.alb!==null)alb=wk.alb;
if(wk.apr!==null)apr=wk.apr;
if(wk.arl!==null)arl=wk.arl;});
mo.agg={lb:hLb?bLb:null,pr:hPr?bPr:null,rl:hRl?bRl:null,
alb:alb,apr:apr,arl:arl,px:x+slotW/2};}
mo.xc=mo.x0+mo.tw/2;x+=mo.tw;});
var xE=PL+drawW;
var pts=[];
mos.forEach(function(mo){
if(mo.ex)mo.wks.forEach(function(wk){
pts.push({x:wk.px,lb:wk.lb,pr:wk.pr,rl:wk.rl,alb:wk.alb,apr:wk.apr,arl:wk.arl,lab:'S'+wk.w+' · '+mo.mn+' '+mo.a});});
else pts.push({x:mo.agg.px,lb:mo.agg.lb,pr:mo.agg.pr,rl:mo.agg.rl,
alb:mo.agg.alb,apr:mo.agg.apr,arl:mo.agg.arl,lab:mo.mn+' '+mo.a});});
var rng=100;function Y(v){return PT+DH-(v/rng)*DH;}
var gy=PT+DH;
var mxB=0;
pts.forEach(function(p){
if(p.lb!==null&&p.lb>mxB)mxB=p.lb;
if(p.pr!==null&&p.pr>mxB)mxB=p.pr;
if(p.rl!==null&&p.rl>mxB)mxB=p.rl;});
var bsc=mxB>0?DH*0.38/mxB:1;
var bw=Math.max(3,Math.min(12,slotW*0.22));
var bgp=Math.max(1,bw*0.15);
var bgw=3*bw+2*bgp;
var s=`<svg width='${svgW}' height='${H}' viewBox='0 0 ${svgW} ${H}' xmlns='http://www.w3.org/2000/svg'>`;
[0,25,50,75,100].forEach(function(v){var gvy=Y(v);
s+=`<line x1='${PL}' y1='${gvy}' x2='${xE}' y2='${gvy}' stroke='#EDEDED' stroke-width='1'/>`;
s+=`<text x='${PL-8}' y='${gvy+5}' font-size='18' fill='#B9B9BC' text-anchor='end'>${v}%</text>`;});
mos.forEach(function(mo){
if(mo.ex)s+=`<rect x='${mo.x0}' y='${PT}' width='${mo.tw}' height='${DH+4}' fill='#F5FAFB'/>`;});
pts.forEach(function(p){
var gx=p.x-bgw/2;
if(p.lb!==null){var h1=p.lb*bsc;
s+=`<rect x='${gx}' y='${gy-h1}' width='${bw}' height='${h1}' rx='1' fill='#B9B9BC' opacity='0.85'/>`;
if(bw>7&&h1>18)s+=`<text x='${gx+bw/2}' y='${gy-h1-4}' font-size='9' fill='#888888' text-anchor='middle'>${p.lb.toFixed(1)}%</text>`;}
if(p.pr!==null){var h2=p.pr*bsc;
s+=`<rect x='${gx+bw+bgp}' y='${gy-h2}' width='${bw}' height='${h2}' rx='1' fill='#648FA0' opacity='0.85'/>`;
if(bw>7&&h2>18)s+=`<text x='${gx+bw+bgp+bw/2}' y='${gy-h2-4}' font-size='9' fill='#648FA0' text-anchor='middle'>${p.pr.toFixed(1)}%</text>`;}
if(p.rl!==null){var h3=p.rl*bsc;
s+=`<rect x='${gx+2*(bw+bgp)}' y='${gy-h3}' width='${bw}' height='${h3}' rx='1' fill='#00A793' opacity='0.85'/>`;
if(bw>7&&h3>18)s+=`<text x='${gx+2*(bw+bgp)+bw/2}' y='${gy-h3-4}' font-size='9' fill='#006357' text-anchor='middle'>${p.rl.toFixed(1)}%</text>`;}});
var plb=[],ppr=[],prl=[];
pts.forEach(function(p){
if(p.alb!==null)plb.push([p.x,Y(p.alb)]);
if(p.apr!==null)ppr.push([p.x,Y(p.apr)]);
if(p.arl!==null)prl.push([p.x,Y(p.arl)]);});
s+=`<path d='${sm(plb)}' fill='none' stroke='#B9B9BC' stroke-width='1.5' stroke-dasharray='6,4' stroke-linecap='round'/>`;
s+=`<path d='${sm(ppr)}' fill='none' stroke='#648FA0' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/>`;
s+=`<path id='rl' d='${sm(prl)}' fill='none' stroke='#00A793' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/>`;
pts.forEach(function(p){
if(p.alb!==null)s+=`<circle cx='${p.x}' cy='${Y(p.alb)}' r='2.5' fill='#B9B9BC' stroke='#fff' stroke-width='1'/>`;
if(p.apr!==null)s+=`<circle cx='${p.x}' cy='${Y(p.apr)}' r='3.5' fill='#648FA0' stroke='#fff' stroke-width='1.5'/>`;
if(p.arl!==null)s+=`<circle cx='${p.x}' cy='${Y(p.arl)}' r='4.5' fill='#00A793' stroke='#fff' stroke-width='2'/>`;});
var lx=-999;
pts.forEach(function(p){
if(p.arl===null)return;
if(p.x-lx<56)return;
lx=p.x;var ry=Y(p.arl),flip=ry-PT<44;
var ly=flip?ry+36:ry-12;
s+=`<rect x='${p.x-26}' y='${ly-20}' width='52' height='22' rx='4' fill='#00A793' opacity='0.93'/>`;
s+=`<text x='${p.x}' y='${ly-5}' font-size='11' font-weight='700' fill='#fff' text-anchor='middle'>${p.arl.toFixed(1)}%</text>`;
});
s+=`<line x1='${PL}' y1='${gy}' x2='${xE}' y2='${gy}' stroke='#DCDCDC' stroke-width='1'/>`;
mos.forEach(function(mo,i){
if(i>0)s+=`<line x1='${mo.x0}' y1='${gy+2}' x2='${mo.x0}' y2='${gy+84}' stroke='#E5E5E5' stroke-width='1' stroke-dasharray='2,3'/>`;});
var fsW=Math.max(9,Math.min(13,slotW*0.26));
mos.forEach(function(mo){
if(mo.ex)mo.wks.forEach(function(wk){
s+=`<text x='${wk.px}' y='${gy+16}' font-size='${fsW}' font-weight='600' fill='#00A793' text-anchor='middle'>S${wk.w}</text>`;
});});
var fsM=Math.max(9,Math.min(14,slotW*0.22));
mos.forEach(function(mo){
var fc=mo.ex?'#006357':'#555555';
s+=`<text x='${mo.xc}' y='${gy+36}' font-size='${fsM}' font-weight='600' fill='${fc}' text-anchor='middle' data-mk='${mo.k}' style='cursor:pointer'>${mo.mn}</text>`;
if(mo.ex)s+=`<line x1='${mo.x0+4}' y1='${gy+39}' x2='${mo.x0+mo.tw-4}' y2='${gy+39}' stroke='#00A793' stroke-width='1.5'/>`;});
var yrM={},yrA=[];
mos.forEach(function(mo){
if(!yrM[mo.a]){yrM[mo.a]={a:mo.a,x0:mo.x0,x1:mo.x0+mo.tw};yrA.push(yrM[mo.a]);}
else yrM[mo.a].x1=mo.x0+mo.tw;});
yrA.forEach(function(yr,i){var cx=(yr.x0+yr.x1)/2;
s+=`<text x='${cx}' y='${gy+66}' font-size='16' font-weight='700' fill='#006357' text-anchor='middle'>${yr.a}</text>`;
if(i>0)s+=`<line x1='${yr.x0}' y1='${gy+46}' x2='${yr.x0}' y2='${gy+74}' stroke='#006357' stroke-width='1.5'/>`;});
pts.forEach(function(p,pi){
s+=`<rect class='hit' data-p='${pi}' x='${p.x-slotW/2}' y='${PT}' width='${slotW}' height='${DH}' fill='transparent' style='cursor:default'/>`;});
s+='</svg>';ch.innerHTML=s;
ch.querySelectorAll('[data-mk]').forEach(function(el){
el.addEventListener('click',function(){EX[this.dataset.mk]=!EX[this.dataset.mk];draw();});});
ch.querySelectorAll('.hit').forEach(function(el){
el.addEventListener('mouseenter',function(e){showTip(parseInt(this.dataset.p,10),e,pts);});
el.addEventListener('mousemove',function(e){showTip(parseInt(this.dataset.p,10),e,pts);});
el.addEventListener('mouseleave',function(){document.getElementById('tt').style.display='none';});});
var rl=document.getElementById('rl');
if(rl&&rl.getTotalLength){var L=rl.getTotalLength();
rl.style.strokeDasharray=L;rl.style.strokeDashoffset=L;
rl.getBoundingClientRect();
rl.style.transition='stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)';
rl.style.strokeDashoffset=0;}
}
var anos=[];D.forEach(function(d){if(anos.indexOf(d.a)<0)anos.push(d.a);});
anos.sort(function(a,b){return a-b;});
var bh='<button class="yb on" data-y="all">Todos</button>';
anos.forEach(function(y){bh+='<button class="yb" data-y="'+y+'">'+y+'</button>';});
document.getElementById('btns').innerHTML=bh;
document.querySelectorAll('.yb').forEach(function(b){
b.addEventListener('click',function(){
document.querySelectorAll('.yb').forEach(function(x){x.classList.remove('on');});
this.classList.add('on');
var y=this.getAttribute('data-y');
sel=y==='all'?null:parseInt(y,10);EX={};draw();});});
draw();
</script>

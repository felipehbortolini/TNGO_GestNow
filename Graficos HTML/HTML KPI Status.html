<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML KPI Status IGD — Preview</title>
<style>
  body{margin:0;background:#F4F5F7;padding:24px;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
  .frame{max-width:1100px;margin:0 auto;background:#F4F5F7;border-radius:8px;overflow:hidden;height:130px;}
  .hint{max-width:1100px;margin:0 auto 12px;color:#7D7D7D;font-size:13px;}
</style>
</head>
<body>
<div class="hint">Preview standalone — KPI Status IGD — cards Estável · Alerta · Crítico com contagem e % do total (dados fake PMO: 34 / 12 / 6)</div>
<div class="frame">
<style>
.frame *{box-sizing:border-box;margin:0;padding:0;}
.frame{font-family:'Segoe UI',sans-serif;}
.wrap{width:100%;height:100%;display:flex;flex-direction:row;align-items:stretch;padding:6px;gap:8px;overflow:hidden;}
.s-card{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding:10px 14px;border-radius:10px;border-left-width:4px;border-left-style:solid;background:#FFFFFF;box-shadow:0 2px 8px rgba(0,0,0,0.07);}
.s-card-top{display:flex;align-items:center;gap:8px;}
.s-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.s-texts{display:flex;flex-direction:row;align-items:baseline;gap:10px;}
.s-lbl{font-size:25px;color:#7D7D7D;font-weight:500;font-family:'Segoe UI',sans-serif;}
.s-val{font-size:32px;font-weight:700;letter-spacing:.5px;line-height:1;}
.s-pct-row{display:flex;align-items:center;gap:6px;}
.s-bar-bg{flex:1;height:4px;border-radius:9999px;background:#F1F1F1;overflow:hidden;}
.s-bar-fill{height:100%;border-radius:9999px;}
.s-pct{font-size:25px;font-weight:600;font-family:'Montserrat','Segoe UI',sans-serif;}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.s-card{animation:fadeUp .4s ease both;}
.s-card:nth-child(1){animation-delay:0s;}
.s-card:nth-child(2){animation-delay:.06s;}
.s-card:nth-child(3){animation-delay:.12s;}
</style>
<div class='wrap'><div class='s-card' style='border-left-color:#4EB776;'><div class='s-card-top'><div class='s-icon' style='background:#F0FAF4;'><svg width='18' height='18' viewBox='0 0 18 18' fill='none' xmlns='http://www.w3.org/2000/svg'><circle cx='9' cy='9' r='7' stroke='#4EB776' stroke-width='2'/><path d='M6 9l2 2 4-4' stroke='#4EB776' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg></div><div class='s-texts'><span class='s-lbl'>Estável</span><span style='font-size:28px;font-weight:700;line-height:1;padding:2px 12px;border-radius:9999px;background:#4EB77622;color:#4EB776;border:1px solid #4EB77655;'>34</span></div></div><div class='s-pct-row'><div class='s-bar-bg'><div class='s-bar-fill' style='width:65.4%;background:#4EB776;'></div></div><span class='s-pct' style='color:#4EB776;'>65,4%</span></div></div><div class='s-card' style='border-left-color:#E8B430;'><div class='s-card-top'><div class='s-icon' style='background:#FFFBEE;'><svg width='18' height='18' viewBox='0 0 18 18' fill='none' xmlns='http://www.w3.org/2000/svg'><path d='M9 2L16 15H2L9 2Z' stroke='#E8B430' stroke-width='2' stroke-linejoin='round'/><path d='M9 8v3' stroke='#E8B430' stroke-width='1.8' stroke-linecap='round'/><circle cx='9' cy='13' r='.8' fill='#E8B430'/></svg></div><div class='s-texts'><span class='s-lbl'>Alerta</span><span style='font-size:28px;font-weight:700;line-height:1;padding:2px 12px;border-radius:9999px;background:#E8B43022;color:#E8B430;border:1px solid #E8B43055;'>12</span></div></div><div class='s-pct-row'><div class='s-bar-bg'><div class='s-bar-fill' style='width:23.1%;background:#E8B430;'></div></div><span class='s-pct' style='color:#E8B430;'>23,1%</span></div></div><div class='s-card' style='border-left-color:#D03636;'><div class='s-card-top'><div class='s-icon' style='background:#FDF0F0;'><svg width='18' height='18' viewBox='0 0 18 18' fill='none' xmlns='http://www.w3.org/2000/svg'><circle cx='9' cy='9' r='7' stroke='#D03636' stroke-width='2'/><path d='M9 5v4' stroke='#D03636' stroke-width='1.8' stroke-linecap='round'/><circle cx='9' cy='12.5' r='.8' fill='#D03636'/></svg></div><div class='s-texts'><span class='s-lbl'>Crítico</span><span style='font-size:28px;font-weight:700;line-height:1;padding:2px 12px;border-radius:9999px;background:#D0363622;color:#D03636;border:1px solid #D0363655;'>6</span></div></div><div class='s-pct-row'><div class='s-bar-bg'><div class='s-bar-fill' style='width:11.5%;background:#D03636;'></div></div><span class='s-pct' style='color:#D03636;'>11,5%</span></div></div></div>
</div>
</body>
</html>

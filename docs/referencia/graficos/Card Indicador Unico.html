<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML KPI Dentro SLA — Preview</title>
<style>
  body{margin:0;background:#F4F5F7;padding:32px;font-family:'Segoe UI',sans-serif;}
  .stage{max-width:280px;margin:0 auto;background:#FFFFFF;border-radius:8px;
    box-shadow:0 2px 4px 0 rgba(0,0,0,0.15);height:110px;overflow:hidden;}
  .meta{max-width:280px;margin:0 auto 18px;color:#2A2A2A;}
  .meta h1{font-family:'Montserrat','Segoe UI',sans-serif;font-size:16px;color:#006357;
    margin:0 0 4px;letter-spacing:.4px;}
  .meta p{margin:0;font-size:12px;color:#7D7D7D;}
</style>
</head>
<body>
  <div class="meta">
    <h1>HTML KPI Dentro SLA</h1>
    <p>Preview standalone — dados fake PMO (% de ciclos concluídos dentro do SLA de 30 dias)</p>
  </div>

  <div class="stage">
    <!-- ===== COMPONENTE (reprodução fiel do HTML/CSS/JS da medida DAX) ===== -->
    <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;overflow:hidden;}
    .kpi-card{width:100%;height:100%;min-height:88px;padding:10px 14px;font-family:'Segoe UI',sans-serif;
      background:transparent;display:flex;flex-direction:column;justify-content:center;gap:6px;
      position:relative;overflow:hidden;}
    .kpi-card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#00A793;}
    .kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .kpi-value{font-family:'Montserrat','Segoe UI',sans-serif;font-size:36px;font-weight:700;
      line-height:1;letter-spacing:-.8px;color:#00A793;}
    .kpi-badge{flex:0 0 auto;display:inline-flex;padding:3px 8px;border-radius:9999px;
      background:#DDF8F0;color:#00A793;font-size:11px;font-weight:700;white-space:nowrap;}
    .kpi-base{font-size:11px;color:#A0A0A0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .kpi-track{width:100%;height:3px;border-radius:9999px;background:#F1F1F1;overflow:hidden;}
    .kpi-fill{width:82.5%;height:100%;border-radius:9999px;background:#00A793;}
    </style>

    <div class="kpi-card">
      <div class="kpi-top">
        <span class="kpi-value">82,5%</span>
        <span class="kpi-badge">Bom desempenho</span>
      </div>
      <span class="kpi-base">394 de 478 processos</span>
      <div class="kpi-track">
        <div class="kpi-fill"></div>
      </div>
    </div>
    <!-- ===== /COMPONENTE ===== -->
  </div>

  <!-- Amostra de domínio PMO refletida: percentual de ciclos de contratação concluídos dentro do
       SLA de 30 dias (data início → data conclusão). Borda/valor/track verdes quando ≥80%, amarelo
       ≥60%, vermelho abaixo disso; cinza quando não há ciclos concluídos no período filtrado. -->
</body>
</html>

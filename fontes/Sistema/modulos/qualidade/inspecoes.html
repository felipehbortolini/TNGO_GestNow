<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inspeções e ITP · Gestão da Qualidade | Gestão Integrada AMT</title>
  <link rel="icon" type="image/png" href="../../assets/logos/timenow-icone.png">
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body data-root="../../" data-page="qualidade/inspecoes">
<div class="app">
  <main class="app-main" id="conteudo">
    <div class="container">

      <h1 class="sr-only" id="titulo">Inspeções e ITP</h1>
      <div class="page-bar">
        <nav data-module-tabs></nav>
        <div class="page-actions" id="acoes-pagina"><button type="button" class="btn btn--primary" id="btn-inspecao"><i data-icon="clipboardCheck"></i>Registrar inspeção</button><button type="button" class="btn btn--secondary" id="btn-itp"><i data-icon="plus"></i>Novo ITP</button><button type="button" class="btn btn--secondary" data-exportar="excel" title="Exportar Excel"><i data-icon="fileSheet"></i><span><span class="btn__prefixo">Exportar </span>Excel</span></button><button type="button" class="btn btn--secondary" data-exportar="pdf" title="Exportar PDF"><i data-icon="filePdf"></i><span><span class="btn__prefixo">Exportar </span>PDF</span></button></div>
      </div>

      <div class="kpi-grid" id="kpis"></div>
      <section class="card card--flush mt-6" aria-labelledby="t-itps">
        <div class="card__header"><div><h2 class="card__title" id="t-itps">Planos de inspeção e testes (ITP)</h2><p class="card__subtitle" id="sub-itps"></p></div></div>
        <div id="tabela-itps"></div>
      </section>
      <div class="toolbar mt-6">
        <div class="toolbar__search input-icon"><i data-icon="search"></i><input class="input input--pill" type="search" id="busca" placeholder="Buscar registro, ponto, ITP ou RNC" aria-label="Buscar inspeções"></div>
        <label class="sr-only" for="f-itp">ITP</label>
        <select class="select" id="f-itp"></select>
        <label class="sr-only" for="f-resultado">Resultado</label>
        <select class="select" id="f-resultado"></select>
        <label class="sr-only" for="f-tipo">Tipo de ponto</label>
        <select class="select" id="f-tipo"></select>
      </div>
      <section class="card card--flush" aria-labelledby="t-insp">
        <div class="card__header"><div><h2 class="card__title" id="t-insp">Registros de inspeção</h2><p class="card__subtitle" id="contagem"></p></div></div>
        <div id="tabela"></div>
      </section>

    </div>
  </main>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/i18n/en.js"></script>
<script src="../../js/siglas.js"></script>
<script src="../../data/mock-config.js"></script>
<script src="../../data/mock-base.js"></script>
<script src="../../data/mock-central.js"></script>
<script src="../../data/mock-planejamento.js"></script>
<script src="../../data/mock-financeiro.js"></script>
<script src="../../data/mock-suprimentos.js"></script>
<script src="../../data/mock-riscos.js"></script>
<script src="../../data/mock-qualidade.js"></script>
<script src="../../data/mock-hse.js"></script>
<script src="../../data/mock-governanca.js"></script>
<script src="../../data/mock-portfolio.js"></script>
<script src="../../js/services/regras.js"></script>
<script src="../../js/services/api.js"></script>
<script src="../../js/components/icons.js"></script>
<script src="../../js/components/ui.js"></script>
<script src="../../js/components/modal.js"></script>
<script src="../../js/components/comum.js"></script>
<script src="../../js/components/tabela.js"></script>
<script src="../../js/components/exportar.js"></script>
<script src="../../js/components/formulario.js"></script>
<script src="../../js/components/upload.js"></script>
<script src="../../js/pages/qualidade/qualidade.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/pages/qualidade/inspecoes.js"></script>
</body>
</html>

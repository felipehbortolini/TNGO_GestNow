<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plano de compras · Suprimentos | Gestão Integrada AMT</title>
  <link rel="icon" type="image/png" href="../../assets/logos/timenow-icone.png">
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body data-root="../../" data-page="suprimentos/plano-compras">
<div class="app">
  <main class="app-main" id="conteudo">
    <div class="container">

      <h1 class="sr-only" id="titulo">Plano de compras</h1>
      <div class="page-bar">
        <nav data-module-tabs></nav>
        <div class="page-actions" id="acoes-pagina"><button type="button" class="btn btn--primary" id="btn-novo"><i data-icon="plus"></i>Novo pacote</button><button type="button" class="btn btn--secondary" id="btn-importar"><i data-icon="upload"></i>Importar Excel</button><button type="button" class="btn btn--secondary" data-exportar="excel" title="Exportar Excel"><i data-icon="fileSheet"></i><span><span class="btn__prefixo">Exportar </span>Excel</span></button><button type="button" class="btn btn--secondary" data-exportar="pdf" title="Exportar PDF"><i data-icon="filePdf"></i><span><span class="btn__prefixo">Exportar </span>PDF</span></button></div>
      </div>

      <div class="toolbar">
        <div class="toolbar__search input-icon"><i data-icon="search"></i><input class="input input--pill" type="search" id="busca" placeholder="Buscar código, escopo ou item da EAC" aria-label="Buscar no plano de compras"></div>
        <label class="sr-only" for="f-tipo">Tipo</label><select class="select" id="f-tipo"></select>
        <label class="check"><input type="checkbox" id="f-lli"> Só itens de longo prazo (LLI)</label>
      </div>
      <div class="kpi-grid" id="kpis"></div>
      <section class="card card--flush mt-6" aria-labelledby="t-plano">
        <div class="card__header"><div><h2 class="card__title" id="t-plano">Pacotes de compra</h2><p class="card__subtitle" id="sub-plano"></p></div>
          <button type="button" class="btn btn--secondary btn--sm" id="btn-colunas"><i data-icon="columns"></i>Colunas</button></div>
        <div id="tabela"></div>
      </section>

    </div>
  </main>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/i18n/en.js"></script>
<script src="../../js/siglas.js"></script>

<script src="../../js/services/regras.js"></script>

<script src="../../js/components/icons.js"></script>
<script src="../../js/components/ui.js"></script>
<script src="../../js/components/modal.js"></script>
<script src="../../js/components/comum.js"></script>
<script src="../../js/components/tabela.js"></script>
<script src="../../js/components/exportar.js"></script>
<script src="../../js/components/formulario.js"></script>
<script src="../../js/components/upload.js"></script>
<script src="../../js/components/importar.js"></script>
<script src="../../js/pages/suprimentos/suprimentos.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/pages/suprimentos/plano-compras.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Processos de compra · Suprimentos | Gestão Integrada AMT</title>
  <link rel="icon" type="image/png" href="../../assets/logos/timenow-icone.png">
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body data-root="../../" data-page="suprimentos/processos">
<div class="app">
  <main class="app-main" id="conteudo">
    <div class="container">

      <h1 class="sr-only" id="titulo">Processos de compra</h1>
      <div class="page-bar">
        <nav data-module-tabs></nav>
        <div class="page-actions" id="acoes-pagina"><button type="button" class="btn btn--primary" id="btn-requisicao"><i data-icon="filePlus"></i>Nova requisição</button><button type="button" class="btn btn--secondary" data-exportar="excel" title="Exportar Excel"><i data-icon="fileSheet"></i><span><span class="btn__prefixo">Exportar </span>Excel</span></button><button type="button" class="btn btn--secondary" data-exportar="pdf" title="Exportar PDF"><i data-icon="filePdf"></i><span><span class="btn__prefixo">Exportar </span>PDF</span></button></div>
      </div>

      <div class="toolbar">
        <div class="toolbar__search input-icon"><i data-icon="search"></i><input class="input input--pill" type="search" id="busca" placeholder="Buscar pacote, RFx ou fornecedor" aria-label="Buscar processos"></div>
        <div class="segmented" data-segmented id="f-situacao" role="group" aria-label="Processos exibidos">
          <button type="button" class="segmented__opt" aria-pressed="true" data-value="andamento">Em andamento</button>
          <button type="button" class="segmented__opt" aria-pressed="false" data-value="todos">Todos</button>
        </div>
      </div>
      <div class="kpi-grid" id="kpis"></div>
      <section class="card card--flush mt-6" aria-labelledby="t-proc">
        <div class="card__header"><div><h2 class="card__title" id="t-proc">Processos de compra (RFx)</h2><p class="card__subtitle" id="sub-proc"></p></div></div>
        <div id="tabela"></div>
      </section>
      <section class="card mt-4" id="detalhe" aria-labelledby="t-det" hidden>
        <div class="card__header"><div><h2 class="card__title" id="t-det"></h2><p class="card__subtitle" id="sub-det"></p></div>
          <div class="btn-group" id="fluxo"></div></div>
        <ol class="stepper stepper--rfx" id="etapas" aria-label="Etapas do processo de compra"></ol>
        <div id="resumo-det"></div>
        <div class="mt-6"><h3 class="section-title">Mapa de equalização</h3></div>
        <p class="text-small text-muted mb-4" id="sub-eq"></p>
        <div id="t-equalizacao"></div>
        <div class="mt-6"><h3 class="section-title">Histórico do processo</h3></div>
        <div id="historico"></div>
      </section>

    </div>
  </main>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/i18n/en.js"></script>
<script src="../../js/siglas.js"></script>
<script src="../../data/mock-config.js"></script>
<script src="../../data/mock-base.js"></script>
<script src="../../data/mock-central.js"></script>
<script src="../../data/mock-planejamento.js"></script>
<script src="../../data/mock-financeiro.js"></script>
<script src="../../data/mock-suprimentos.js"></script>
<script src="../../data/mock-riscos.js"></script>
<script src="../../data/mock-qualidade.js"></script>
<script src="../../data/mock-hse.js"></script>
<script src="../../data/mock-governanca.js"></script>
<script src="../../data/mock-portfolio.js"></script>
<script src="../../js/services/regras.js"></script>
<script src="../../js/services/api.js"></script>
<script src="../../js/components/icons.js"></script>
<script src="../../js/components/ui.js"></script>
<script src="../../js/components/modal.js"></script>
<script src="../../js/components/comum.js"></script>
<script src="../../js/components/tabela.js"></script>
<script src="../../js/components/exportar.js"></script>
<script src="../../js/components/formulario.js"></script>
<script src="../../js/components/upload.js"></script>
<script src="../../js/pages/suprimentos/suprimentos.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/pages/suprimentos/processos.js"></script>
</body>
</html>

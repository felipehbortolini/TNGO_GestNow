<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ações · Central de Ações | Gestão Integrada AMT</title>
  <link rel="icon" type="image/png" href="../../assets/logos/timenow-icone.png">
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body data-root="../../" data-page="central-acoes/acoes">
<div class="app">
  <main class="app-main" id="conteudo">
    <div class="container">

      <h1 class="sr-only" id="titulo">Ações</h1>
      <div class="page-bar">
        <nav data-module-tabs></nav>
        <div class="page-actions" id="acoes-pagina"><button type="button" class="btn btn--secondary" id="btn-followup"><i data-icon="mail"></i>Enviar follow-up</button><button type="button" class="btn btn--secondary" data-exportar="excel" title="Exportar Excel"><i data-icon="fileSheet"></i><span><span class="btn__prefixo">Exportar </span>Excel</span></button><button type="button" class="btn btn--secondary" data-exportar="pdf" title="Exportar PDF"><i data-icon="filePdf"></i><span><span class="btn__prefixo">Exportar </span>PDF</span></button></div>
      </div>

      <div class="kpi-grid kpi-grid--4" id="kpis"></div>

      <div class="toolbar mt-6">
        <div class="toolbar__search input-icon"><i data-icon="search"></i><input class="input input--pill" type="search" id="busca" placeholder="Buscar assunto, referência ou responsável" aria-label="Buscar nas ações"></div>
        <button type="button" class="btn btn--secondary" id="btn-filtros"><i data-icon="filter"></i>Filtros</button>
        <div class="segmented" data-segmented id="visao" role="group" aria-label="Forma de visualização">
          <button type="button" class="segmented__opt" aria-pressed="true" data-value="lista"><i data-icon="list"></i>Lista</button>
          <button type="button" class="segmented__opt" aria-pressed="false" data-value="kanban"><i data-icon="kanban"></i>Kanban</button>
        </div>
      </div>
      <div class="filter-bar mb-4" id="chips"></div>

      <section class="card card--flush" id="painel-lista" aria-labelledby="t-lista">
        <div class="card__header">
          <div><h2 class="card__title" id="t-lista">Lista de ações</h2><p class="card__subtitle" id="contagem"></p></div>
          <button type="button" class="btn btn--ghost btn--sm" id="btn-colunas"><i data-icon="columns"></i>Colunas</button>
        </div>
        <div id="tabela"></div>
      </section>

      <section id="painel-kanban" hidden aria-label="Ações por status">
        <div class="kanban" id="kanban"></div>
      </section>

    </div>
  </main>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/i18n/en.js"></script>
<script src="../../js/siglas.js"></script>
<script src="../../data/mock-config.js"></script>
<script src="../../data/mock-base.js"></script>
<script src="../../data/mock-central.js"></script>
<script src="../../data/mock-planejamento.js"></script>
<script src="../../data/mock-financeiro.js"></script>
<script src="../../data/mock-suprimentos.js"></script>
<script src="../../data/mock-riscos.js"></script>
<script src="../../data/mock-qualidade.js"></script>
<script src="../../data/mock-hse.js"></script>
<script src="../../data/mock-governanca.js"></script>
<script src="../../data/mock-portfolio.js"></script>
<script src="../../js/services/regras.js"></script>
<script src="../../js/services/api.js"></script>
<script src="../../js/components/icons.js"></script>
<script src="../../js/components/ui.js"></script>
<script src="../../js/components/modal.js"></script>
<script src="../../js/components/comum.js"></script>
<script src="../../js/components/tabela.js"></script>
<script src="../../js/components/exportar.js"></script>
<script src="../../js/components/formulario.js"></script>
<script src="../../js/components/upload.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/pages/central-acoes/acoes.js"></script>
</body>
</html>

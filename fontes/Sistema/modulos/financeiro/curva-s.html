<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curva S financeira · Gestão Financeira | Gestão Integrada AMT</title>
  <link rel="icon" type="image/png" href="../../assets/logos/timenow-icone.png">
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/layout.css">

<body data-root="../../" data-page="financeiro/curva-s">
<div class="app">
  <main class="app-main" id="conteudo">
    <div class="container">

      <h1 class="sr-only" id="titulo">Curva S financeira</h1>
      <div class="page-bar">
        <nav data-module-tabs></nav>
        <div class="page-actions" id="acoes-pagina"><button type="button" class="btn btn--secondary" data-analise="financeiro"><i data-icon="clipboardList"></i>Análise do período</button><button type="button" class="btn btn--secondary" data-exportar="excel" title="Exportar Excel"><i data-icon="fileSheet"></i><span><span class="btn__prefixo">Exportar </span>Excel</span></button><button type="button" class="btn btn--secondary" data-exportar="pdf" title="Exportar PDF"><i data-icon="filePdf"></i><span><span class="btn__prefixo">Exportar </span>PDF</span></button></div>
      </div>

      <div class="kpi-grid kpi-grid--4" id="kpis"></div>
      <section class="card mt-6" aria-labelledby="t-curva">
        <div class="card__header"><div><h2 class="card__title" id="t-curva">Curva S financeira (CAPEX)</h2><p class="card__subtitle" id="sub-curva"></p></div></div>
        <div class="chart chart--lg"><canvas id="g-curva"></canvas></div>
      </section>
      <section class="card card--flush mt-4" aria-labelledby="t-periodos">
        <div class="card__header"><div><h2 class="card__title" id="t-periodos">Período a período</h2><p class="card__subtitle">Valores em R$ mil</p></div></div>
        <div id="tabela"></div>
      </section>

    </div>
  </main>
</div>

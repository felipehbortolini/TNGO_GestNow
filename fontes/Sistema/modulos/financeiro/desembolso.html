<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cronograma de desembolso · Gestão Financeira | Gestão Integrada AMT</title>
  <link rel="icon" type="image/png" href="../../assets/logos/timenow-icone.png">
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body data-root="../../" data-page="financeiro/desembolso">
<div class="app">
  <main class="app-main" id="conteudo">
    <div class="container">

      <h1 class="sr-only" id="titulo">Cronograma de desembolso</h1>
      <div class="page-bar">
        <nav data-module-tabs></nav>
        <div class="page-actions" id="acoes-pagina"><button type="button" class="btn btn--secondary" id="btn-enviar"><i data-icon="send"></i>Enviar à tesouraria</button><button type="button" class="btn btn--secondary" data-exportar="excel" title="Exportar Excel"><i data-icon="fileSheet"></i><span><span class="btn__prefixo">Exportar </span>Excel</span></button><button type="button" class="btn btn--secondary" data-exportar="pdf" title="Exportar PDF"><i data-icon="filePdf"></i><span><span class="btn__prefixo">Exportar </span>PDF</span></button></div>
      </div>

      <div class="toolbar">
        <label class="sr-only" for="f-nivel">Mostrar até</label>
        <select class="select" id="f-nivel">
          <option value="1">Mostrar pacotes</option>
          <option value="2" selected>Mostrar subpacotes</option>
          <option value="3">Mostrar itens</option>
        </select>
      </div>
      <div class="kpi-grid kpi-grid--4" id="kpis"></div>
      <section class="card mt-6" aria-labelledby="t-hist">
        <div class="card__header"><div><h2 class="card__title" id="t-hist">Desembolso mensal</h2><p class="card__subtitle" id="sub-hist"></p></div></div>
        <div class="chart chart--lg"><canvas id="g-mensal"></canvas></div>
      </section>
      <section class="card card--flush mt-4" aria-labelledby="t-grade">
        <div class="card__header"><div><h2 class="card__title" id="t-grade">Saldo a pagar por mês</h2><p class="card__subtitle">Valores em R$ mil · saldo = projeção no término menos realizado, distribuído pelo perfil da projeção</p></div></div>
        <div id="tabela"></div>
      </section>

    </div>
  </main>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/i18n/en.js"></script>

<script src="../../data/mock-portfolio.js"></script>
<script src="../../js/services/regras.js"></script>
<script src="../../js/services/api.js"></script>
<script src="../../assets/vendor/chart.umd.min.js"></script>
<script src="../../js/components/icons.js"></script>
<script src="../../js/components/ui.js"></script>
<script src="../../js/components/modal.js"></script>
<script src="../../js/components/comum.js"></script>
<script src="../../js/components/tabela.js"></script>
<script src="../../js/components/exportar.js"></script>
<script src="../../js/components/formulario.js"></script>
<script src="../../js/components/upload.js"></script>
<script src="../../js/components/charts.js"></script>
<script src="../../js/pages/financeiro/financeiro.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/pages/financeiro/desembolso.js"></script>
</body>
</html>

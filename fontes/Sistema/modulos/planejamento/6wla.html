<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>6WLA · Planejamento | Gestão Integrada AMT</title>
  <link rel="icon" type="image/png" href="../../assets/logos/timenow-icone.png">
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body data-root="../../" data-page="planejamento/6wla">
<div class="app">
  <main class="app-main" id="conteudo">
    <div class="container">

      <h1 class="sr-only" id="titulo">6WLA</h1>
      <div class="page-bar">
        <nav data-module-tabs></nav>
        <div class="page-actions" id="acoes-pagina"><button type="button" class="btn btn--primary" id="btn-atividade"><i data-icon="plus"></i>Nova atividade</button><button type="button" class="btn btn--secondary" id="btn-restricao"><i data-icon="flag"></i>Nova restrição</button><button type="button" class="btn btn--secondary" data-exportar="excel" title="Exportar Excel"><i data-icon="fileSheet"></i><span><span class="btn__prefixo">Exportar </span>Excel</span></button><button type="button" class="btn btn--secondary" data-exportar="pdf" title="Exportar PDF"><i data-icon="filePdf"></i><span><span class="btn__prefixo">Exportar </span>PDF</span></button></div>
      </div>

      <div class="kpi-grid" id="kpis"></div>
      <div class="toolbar mt-6">
        <div class="toolbar__search input-icon"><i data-icon="search"></i><input class="input input--pill" type="search" id="busca" placeholder="Buscar atividade, área ou código" aria-label="Buscar atividades"></div>
        <label class="sr-only" for="f-disciplina">Disciplina</label><select class="select" id="f-disciplina"></select>
        <label class="check"><input type="checkbox" id="f-restricao"> Só com restrição aberta</label>
      </div>
      <section class="card card--flush" aria-labelledby="t-grade">
        <div class="card__header"><div><h2 class="card__title" id="t-grade">Grade de 6 semanas</h2><p class="card__subtitle" id="sub-grade"></p></div></div>
        <div id="grade"></div>
      </section>
      <section class="card card--flush mt-4" aria-labelledby="t-restr">
        <div class="card__header"><div><h2 class="card__title" id="t-restr">Restrições</h2><p class="card__subtitle">Tipo, situação e data de remoção; vencida = data necessária passou sem remoção</p></div>
          <div class="segmented" data-segmented id="f-sit-restr" role="group" aria-label="Situação das restrições">
            <button type="button" class="segmented__opt" aria-pressed="true" data-value="abertas">Abertas</button>
            <button type="button" class="segmented__opt" aria-pressed="false" data-value="todas">Todas</button>
          </div></div>
        <div id="restricoes"></div>
      </section>

    </div>
  </main>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/i18n/en.js"></script>
<script src="../../js/siglas.js"></script>
<script src="../../data/mock-config.js"></script>
<script src="../../data/mock-base.js"></script>
<script src="../../data/mock-central.js"></script>
<script src="../../data/mock-planejamento.js"></script>
<script src="../../data/mock-financeiro.js"></script>
<script src="../../data/mock-suprimentos.js"></script>
<script src="../../data/mock-riscos.js"></script>
<script src="../../data/mock-qualidade.js"></script>
<script src="../../data/mock-hse.js"></script>
<script src="../../data/mock-governanca.js"></script>
<script src="../../data/mock-portfolio.js"></script>
<script src="../../js/services/regras.js"></script>
<script src="../../js/services/api.js"></script>
<script src="../../js/components/icons.js"></script>
<script src="../../js/components/ui.js"></script>
<script src="../../js/components/modal.js"></script>
<script src="../../js/components/comum.js"></script>
<script src="../../js/components/tabela.js"></script>
<script src="../../js/components/exportar.js"></script>
<script src="../../js/components/formulario.js"></script>
<script src="../../js/components/upload.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/pages/planejamento/6wla.js"></script>
</body>
</html>

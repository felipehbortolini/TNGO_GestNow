<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relato do período · Planejamento | Gestão Integrada AMT</title>
  <link rel="icon" type="image/png" href="../../assets/logos/timenow-icone.png">
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body data-root="../../" data-page="planejamento/relato">
<div class="app">
  <main class="app-main" id="conteudo">
    <div class="container">

      <h1 class="sr-only" id="titulo">Relato do período</h1>
      <div class="page-bar">
        <nav data-module-tabs></nav>
        <div class="page-actions" id="acoes-pagina"><button type="button" class="btn btn--secondary" data-analise="planejamento"><i data-icon="clipboardList"></i>Análise do período</button><button type="button" class="btn btn--primary" id="btn-novo"><i data-icon="plus"></i>Novo relato</button><button type="button" class="btn btn--secondary" data-exportar="excel" title="Exportar Excel"><i data-icon="fileSheet"></i><span><span class="btn__prefixo">Exportar </span>Excel</span></button><button type="button" class="btn btn--secondary" data-exportar="pdf" title="Exportar PDF"><i data-icon="filePdf"></i><span><span class="btn__prefixo">Exportar </span>PDF</span></button></div>
      </div>

      <div class="toolbar">
        <div class="segmented" data-segmented id="f-tipo" role="group" aria-label="Tipo de relato">
          <button type="button" class="segmented__opt" aria-pressed="true" data-value="">Todos</button>
          <button type="button" class="segmented__opt" aria-pressed="false" data-value="Semanal">Semanais</button>
          <button type="button" class="segmented__opt" aria-pressed="false" data-value="Mensal">Mensais</button>
        </div>
        <div class="toolbar__search input-icon"><i data-icon="search"></i><input class="input input--pill" type="search" id="busca" placeholder="Buscar atividade, ponto de atenção ou risco" aria-label="Buscar nos relatos"></div>
      </div>
      <div class="kpi-grid" id="kpis"></div>
      <section class="card card--flush mt-6" aria-labelledby="t-relatos">
        <div class="card__header"><div><h2 class="card__title" id="t-relatos">Relatos registrados</h2><p class="card__subtitle">Um registro semanal e um mensal por período; alimentam a página 2 do Planejamento no relatório gerencial (Início)</p></div></div>
        <div id="tabela"></div>
      </section>

    </div>
  </main>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/i18n/en.js"></script>
<script src="../../js/siglas.js"></script>
<script src="../../data/mock-config.js"></script>

<script src="../../data/mock-governanca.js"></script>
<script src="../../data/mock-portfolio.js"></script>
<script src="../../js/services/regras.js"></script>
<script src="../../js/services/api.js"></script>
<script src="../../js/components/icons.js"></script>
<script src="../../js/components/ui.js"></script>
<script src="../../js/components/modal.js"></script>
<script src="../../js/components/comum.js"></script>
<script src="../../js/components/tabela.js"></script>
<script src="../../js/components/exportar.js"></script>
<script src="../../js/components/formulario.js"></script>
<script src="../../js/components/upload.js"></script>

<script src="../../js/layout.js"></script>
<script src="../../js/pages/planejamento/relato.js"></script>
</body>
</html>

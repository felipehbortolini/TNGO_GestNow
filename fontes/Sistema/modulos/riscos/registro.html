<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de riscos · Gestão de Riscos | Gestão Integrada AMT</title>
  <link rel="icon" type="image/png" href="../../assets/logos/timenow-icone.png">
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body data-root="../../" data-page="riscos/registro">
<div class="app">
  <main class="app-main" id="conteudo">
    <div class="container">

      <h1 class="sr-only" id="titulo">Registro de riscos</h1>
      <div class="page-bar">
        <nav data-module-tabs></nav>
        <div class="page-actions" id="acoes-pagina"><button type="button" class="btn btn--primary" id="btn-novo"><i data-icon="plus"></i>Novo risco</button><a class="btn btn--secondary" id="lnk-matriz" href="matriz.html"><i data-icon="matrix"></i>Matriz 5x5</a><button type="button" class="btn btn--secondary" data-exportar="excel" title="Exportar Excel"><i data-icon="fileSheet"></i><span><span class="btn__prefixo">Exportar </span>Excel</span></button><button type="button" class="btn btn--secondary" data-exportar="pdf" title="Exportar PDF"><i data-icon="filePdf"></i><span><span class="btn__prefixo">Exportar </span>PDF</span></button></div>
      </div>

      <div class="toolbar">
        <div class="toolbar__search input-icon"><i data-icon="search"></i><input class="input input--pill" type="search" id="busca" placeholder="Buscar por número, título, causa ou dono" aria-label="Buscar riscos"></div>
        <button type="button" class="btn btn--secondary" id="btn-filtros"><i data-icon="filter"></i>Filtros</button>
        <div class="segmented" data-segmented id="f-aval" role="group" aria-label="Avaliação exibida">
          <button type="button" class="segmented__opt" aria-pressed="false" data-value="inerente">Inerente</button>
          <button type="button" class="segmented__opt" aria-pressed="true" data-value="residual">Residual</button>
        </div>
        <button type="button" class="btn btn--ghost" id="btn-atualizar" title="Refaz a consulta com os filtros atuais"><i data-icon="refresh"></i>Atualizar</button>
      </div>
      <div id="contexto"></div>
      <div class="kpi-grid" id="kpis"></div>
      <div id="aviso" class="mt-4"></div>
      <div class="filter-bar mt-4" id="chips"></div>
      <section class="card card--flush mt-4" aria-labelledby="t-reg">
        <div class="card__header"><div><h2 class="card__title" id="t-reg">Registro de riscos</h2><p class="card__subtitle" id="contagem"></p></div>
          <button type="button" class="btn btn--ghost btn--sm" id="btn-colunas"><i data-icon="columns"></i>Colunas</button></div>
        <div id="tabela" class="tabela-riscos"></div>
      </section>

    </div>
  </main>
</div>

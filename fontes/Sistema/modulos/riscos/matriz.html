<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matriz de riscos 5x5 · Gestão de Riscos | Gestão Integrada AMT</title>
  <link rel="icon" type="image/png" href="../../assets/logos/timenow-icone.png">
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body data-root="../../" data-page="riscos/matriz">
<div class="app">
  <main class="app-main" id="conteudo">
    <div class="container">

      <h1 class="sr-only" id="titulo">Matriz de riscos 5x5</h1>
      <div class="page-bar">
        <nav data-module-tabs></nav>
        <div class="page-actions" id="acoes-pagina"><a class="btn btn--secondary" id="lnk-registro" href="registro.html"><i data-icon="list"></i>Registro</a><button type="button" class="btn btn--secondary" data-exportar="excel" title="Exportar Excel"><i data-icon="fileSheet"></i><span><span class="btn__prefixo">Exportar </span>Excel</span></button><button type="button" class="btn btn--secondary" data-exportar="pdf" title="Exportar PDF"><i data-icon="filePdf"></i><span><span class="btn__prefixo">Exportar </span>PDF</span></button></div>
      </div>

      <div class="toolbar">
        <div class="segmented" data-segmented id="f-aval" role="group" aria-label="Avaliação exibida">
          <button type="button" class="segmented__opt" aria-pressed="false" data-value="inerente">Inerente</button>
          <button type="button" class="segmented__opt" aria-pressed="true" data-value="residual">Residual</button>
        </div>
        <label class="sr-only" for="f-natureza">Natureza</label>
        <select class="select" id="f-natureza">
          <option value="">Natureza: todas</option>
          <option value="Ameaça">Somente ameaças</option>
          <option value="Oportunidade">Somente oportunidades</option>
        </select>
      </div>
      <div id="contexto"></div>
      <div class="grid grid--sidebar">
        <section class="card" aria-labelledby="t-mat">
          <div class="card__header"><div><h2 class="card__title" id="t-mat">Distribuição por probabilidade e impacto</h2>
            <p class="card__subtitle" id="sub-mat"></p></div></div>
          <p class="text-small text-muted mb-4">Cada célula mostra a quantidade de riscos e os números. Clique na célula para abrir o registro já filtrado.</p>
          <div id="matriz"></div>
          <div class="mt-4" id="legenda"></div>
          <p class="text-small text-muted" id="nota-mat"></p>
        </section>
        <section class="card" aria-labelledby="t-mov">
          <div class="card__header"><div><h2 class="card__title" id="t-mov">Movimentação inerente para residual</h2>
            <p class="card__subtitle">Eficácia do plano de resposta</p></div></div>
          <div id="mov"></div>
          <p class="text-small text-muted mt-4" id="nota-mov"></p>
        </section>
      </div>

    </div>
  </main>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/i18n/en.js"></script>
<script src="../../js/siglas.js"></script>
<script src="../../data/mock-config.js"></script>

<script src="../../data/mock-planejamento.js"></script>
<script src="../../data/mock-financeiro.js"></script>

<script src="../../data/mock-riscos.js"></script>
<script src="../../data/mock-qualidade.js"></script>
<script src="../../data/mock-hse.js"></script>
<script src="../../data/mock-governanca.js"></script>
<script src="../../data/mock-portfolio.js"></script>
<script src="../../js/services/regras.js"></script>
<script src="../../js/services/api.js"></script>
<script src="../../js/components/icons.js"></script>
<script src="../../js/components/ui.js"></script>
<script src="../../js/components/modal.js"></script>
<script src="../../js/components/comum.js"></script>
<script src="../../js/components/tabela.js"></script>
<script src="../../js/components/exportar.js"></script>
<script src="../../js/components/formulario.js"></script>
<script src="../../js/components/upload.js"></script>
<script src="../../js/pages/riscos/riscos.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/pages/riscos/matriz.js"></script>
</body>
</html>

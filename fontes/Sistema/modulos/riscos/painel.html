<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de riscos · Gestão de Riscos | Gestão Integrada AMT</title>
  <link rel="icon" type="image/png" href="../../assets/logos/timenow-icone.png">
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body data-root="../../" data-page="riscos/painel">
<div class="app">
  <main class="app-main" id="conteudo">
    <div class="container">

      <h1 class="sr-only" id="titulo">Painel de riscos</h1>
      <div class="page-bar">
        <nav data-module-tabs></nav>
        <div class="page-actions" id="acoes-pagina"><button type="button" class="btn btn--secondary" data-analise="riscos"><i data-icon="clipboardList"></i>Análise do período</button><a class="btn btn--secondary" id="lnk-registro" href="registro.html"><i data-icon="list"></i>Registro</a><button type="button" class="btn btn--secondary" data-exportar="excel" title="Exportar Excel"><i data-icon="fileSheet"></i><span><span class="btn__prefixo">Exportar </span>Excel</span></button><button type="button" class="btn btn--secondary" data-exportar="pdf" title="Exportar PDF"><i data-icon="filePdf"></i><span><span class="btn__prefixo">Exportar </span>PDF</span></button></div>
      </div>

      <p class="text-small text-muted mb-4" id="escopo"></p>
      <div class="kpi-grid" id="kpis"></div>
      <div class="grid grid--2 mt-6">
        <section class="card" aria-labelledby="t-cat">
          <div class="card__header"><div><h2 class="card__title" id="t-cat">Exposição por categoria (RBS)</h2>
            <p class="card__subtitle">Soma do score residual das ameaças ativas; clique para abrir o registro filtrado</p></div></div>
          <div id="categorias"></div>
        </section>
        <section class="card" aria-labelledby="t-evo">
          <div class="card__header"><div><h2 class="card__title" id="t-evo">Evolução da exposição total</h2>
            <p class="card__subtitle">Score residual somado das ameaças, por mês (fotografia mensal; mês corrente recalculado)</p></div></div>
          <div class="chart"><canvas id="g-evolucao"></canvas></div>
        </section>
      </div>
      <section class="card card--flush mt-4" aria-labelledby="t-pauta">
        <div class="card__header"><div><h2 class="card__title" id="t-pauta">Pauta de escalonamento</h2>
          <p class="card__subtitle" id="sub-pauta"></p></div>
          <button type="button" class="btn btn--secondary btn--sm" id="btn-email"><i data-icon="mail"></i>Enviar por e-mail</button></div>
        <div id="pauta"></div>
      </section>

    </div>
  </main>
</div>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Início | Gestão Integrada AMT</title>
  <link rel="icon" type="image/png" href="assets/logos/timenow-icone.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-root="" data-page="home">
<div class="app">
  <main class="app-main" id="conteudo">
    <div class="container">

      <h1 class="sr-only">Início</h1>
      <div class="page-bar">
        <div class="cluster" id="home-meta" aria-label="Contexto do projeto ou do portfólio"></div>
        <div class="page-actions" id="acoes-pagina"><button type="button" class="btn btn--primary" id="btn-relatorio" title="Emitir o relatório gerencial semanal ou mensal (A4 horizontal)"><i data-icon="printer"></i>Relatório gerencial</button><button type="button" class="btn btn--secondary" data-exportar="excel" title="Exportar Excel"><i data-icon="fileSheet"></i><span><span class="btn__prefixo">Exportar </span>Excel</span></button><button type="button" class="btn btn--secondary" data-exportar="pdf" title="Exportar PDF"><i data-icon="filePdf"></i><span><span class="btn__prefixo">Exportar </span>PDF</span></button></div>
      </div>

      <section aria-labelledby="home-kpis-titulo">
        <h2 class="section-title" id="home-kpis-titulo"><i data-icon="gauge"></i>Indicadores-chave por módulo</h2>
        <div class="kpi-grid kpi-grid--4" id="home-kpis"></div>
      </section>

      <section class="card card--flush mt-6" id="home-carteira-sec" aria-labelledby="home-carteira-titulo" hidden>
        <div class="card__header">
          <div>
            <h2 class="card__title" id="home-carteira-titulo">Carteira de projetos</h2>
            <p class="card__subtitle" id="home-carteira-sub"></p>
          </div>
          <button type="button" class="btn btn--secondary btn--sm" id="btn-ponderacao"><i data-icon="sliders"></i>Ponderação</button>
        </div>
        <div id="home-carteira"></div>
      </section>

      <section class="card mt-6" aria-labelledby="home-alertas-titulo">
        <div class="card__header">
          <div>
            <h2 class="card__title" id="home-alertas-titulo">Pontos de atenção</h2>
            <p class="card__subtitle">Itens que pedem decisão ou ação, calculados na data de referência.</p>
          </div>
          <span class="badge badge--danger" id="home-alertas-total"></span>
        </div>
        <ul class="feed" id="home-alertas"></ul>
      </section>

      <section class="mt-6" aria-labelledby="home-modulos-titulo">
        <h2 class="section-title" id="home-modulos-titulo"><i data-icon="dashboard"></i>Módulos</h2>
        <div class="grid grid--4" id="home-modulos"></div>
      </section>

    </div>
  </main>
</div>

<!-- Dados (mock) e fachada de dados: trocar pelos endpoints na fase com backend -->
<script src="js/i18n.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/siglas.js"></script>
<script src="data/mock-config.js"></script>
<script src="data/mock-base.js"></script>
<script src="data/mock-central.js"></script>
<script src="data/mock-planejamento.js"></script>
<script src="data/mock-financeiro.js"></script>
<script src="data/mock-suprimentos.js"></script>
<script src="data/mock-riscos.js"></script>
<script src="data/mock-qualidade.js"></script>
<script src="data/mock-hse.js"></script>
<script src="data/mock-governanca.js"></script>
<script src="data/mock-portfolio.js"></script>
<script src="js/services/regras.js"></script>
<script src="js/services/api.js"></script>
<!-- Componentes e estrutura -->
<script src="js/components/icons.js"></script>
<script src="js/components/ui.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/comum.js"></script>
<script src="js/components/tabela.js"></script>
<script src="js/components/exportar.js"></script>
<script src="js/components/formulario.js"></script>
<script src="js/layout.js"></script>
<!-- Tela -->
<script src="js/pages/home.js"></script>
</body>
</html>

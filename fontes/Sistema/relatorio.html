<!-- Relatório gerencial: página própria, sem menu, com folhas A4 na horizontal para impressão ou PDF -->
<body class="relatorio-body" data-root="" data-page="relatorio">
  <div class="relatorio-barra">
    <a class="btn btn--secondary" href="index.html"><i data-icon="chevronLeft"></i>Início</a>
    <div class="relatorio-barra__titulo"><b id="rel-titulo">Relatório gerencial</b><span id="rel-sub">Montando o relatório...</span></div>
    <div class="relatorio-barra__acoes">
      <a class="btn btn--secondary" id="btn-alterar" href="index.html?relatorio=1"><i data-icon="calendarRange"></i>Alterar período</a>
      <button type="button" class="btn btn--secondary" data-exportar="excel" title="Exportar Excel"><i data-icon="fileSheet"></i>Excel</button>
      <button type="button" class="btn btn--primary" id="btn-imprimir" title="Imprimir ou salvar em PDF pela impressão do navegador"><i data-icon="printer"></i>Imprimir / PDF</button>
    </div>
  </div>
  <h1 class="sr-only">Relatório gerencial</h1>
  <div class="relatorio-aviso" id="aviso" aria-live="polite"></div>
  <main class="relatorio-folhas" id="conteudo">
    <div class="relatorio-folhas__pilha" id="folhas"></div>
  </main>
